<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dompet Keluarga</title>

  <!-- PWA Meta Tags & iOS Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dompet Keluarga">

  <!-- Favicon & Apple Touch Icon (SVG Inline Data URI) -->

  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230F766E'/><path d='M30 45 L50 25 L70 45 V72 H30 Z' fill='%23FFFFFF'/><path d='M43 72 V55 H57 V72 Z' fill='%2315803D'/></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#FAF8F5',
              green: '#0F766E',
              greenDark: '#0D655E',
              coral: '#E05A47',
              coralDark: '#C94C3B',
              amber: '#D97706',
              card: '#FFFFFF'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Firebase JS SDK v10 Compat CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    /* Prevent iOS input auto-zoom by ensuring min font size 16px */
    input, select, textarea {
      font-size: 16px !important;
    }
    body {
      background-color: #FAF8F5;
      color: #1E293B;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .custom-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col justify-between antialiased selection:bg-teal-100 selection:text-teal-900">

  <!-- MAIN WRAPPER -->
  <div id="app" class="max-w-md mx-auto w-full min-h-screen bg-brand-bg flex flex-col shadow-xl relative pb-20">

    <!-- HEADER UTAMA -->
    <header class="sticky top-0 z-20 bg-brand-bg/95 backdrop-blur border-b border-stone-200/60 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- Logo Icon -->
        <div class="w-10 h-10 rounded-2xl bg-teal-700 flex items-center justify-center text-white shadow-md shadow-teal-700/20">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-stone-900 text-base leading-tight">Dompet Keluarga</h1>
            <!-- Status Cloud Indicator -->
            <span id="cloudStatusDot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse inline-block" title="Menghubungkan ke Cloud..."></span>
          </div>
          <p id="headerSubtitle" class="text-xs text-teal-700 font-medium">Pengeluaran 📉</p>
        </div>
      </div>

      <!-- Hamburger Menu Button -->
      <button onclick="toggleDrawer(true)" class="w-10 h-10 rounded-xl bg-white border border-stone-200 flex items-center justify-center text-stone-700 active:scale-95 transition shadow-sm">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </header>

    <!-- MEMBER BAR (Pencatat Aktif) -->
    <div class="bg-white border-b border-stone-100 px-4 py-2.5 flex items-center gap-2 overflow-x-auto custom-scrollbar">
      <span class="text-xs font-semibold text-stone-400 uppercase tracking-wider shrink-0">PROFIL:</span>
      <div id="memberChipContainer" class="flex items-center gap-2">
        <!-- Dynamic chips generated by JS -->
      </div>
      <button id="btnAddMemberBar" onclick="openAddMemberModal()" class="shrink-0 text-xs bg-teal-50 hover:bg-teal-100 text-teal-700 font-medium px-3 py-1.5 rounded-full border border-teal-200 transition flex items-center gap-1 active:scale-95">
        <span>+ Tambah</span>
      </button>
    </div>

    <!-- LINKED BANNER (Jika sedang terhubung ke HP lain) -->
    <div id="linkedStatusBanner" class="hidden bg-stone-900 text-white px-4 py-2 text-xs flex items-center justify-between shadow-inner">
      <div class="flex items-center gap-2 overflow-hidden">
        <span id="linkedBannerIcon">👁️</span>
        <span id="linkedBannerText" class="truncate font-medium">Terhubung ke DK-XXXX</span>
      </div>
      <button onclick="disconnectWallet()" class="bg-stone-700 hover:bg-red-600 px-2.5 py-1 rounded-md text-[11px] font-semibold transition shrink-0">
        Putuskan
      </button>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main id="mainContainer" class="p-4 flex-1">
      <!-- Content renders dynamically based on current page -->
    </main>

  </div>

  <!-- SLIDE-OVER DRAWER NAVIGASI -->
  <div id="drawerOverlay" class="fixed inset-0 z-40 bg-stone-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300" onclick="toggleDrawer(false)"></div>
  <aside id="drawer" class="fixed top-0 right-0 bottom-0 z-50 w-4/5 max-w-xs bg-white shadow-2xl transform translate-x-full transition-transform duration-300 ease-out flex flex-col">
    <!-- Drawer Header -->
    <div class="p-5 border-b border-stone-100 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="text-2xl">🏡</span>
        <span class="font-bold text-stone-900 text-lg">Menu Fitur</span>
      </div>
      <button onclick="toggleDrawer(false)" class="w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center text-stone-500 hover:bg-stone-200">
        ✕
      </button>
    </div>

    <!-- Nav Items -->
    <nav class="p-3 space-y-1 flex-1 overflow-y-auto">
      <button onclick="switchPage('pengeluaran')" class="nav-item w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-stone-700 hover:bg-teal-50 hover:text-teal-800 transition text-left" data-page="pengeluaran">
        <span class="text-xl">💸</span>
        <div>
          <p class="text-sm font-semibold">Pengeluaran</p>
          <p class="text-xs text-stone-400">Pantau belanja & tagihan</p>
        </div>
      </button>

      <button onclick="switchPage('pemasukan')" class="nav-item w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-stone-700 hover:bg-teal-50 hover:text-teal-800 transition text-left" data-page="pemasukan">
        <span class="text-xl">💰</span>
        <div>
          <p class="text-sm font-semibold">Pemasukan</p>
          <p class="text-xs text-stone-400">Catat gaji & hasil usaha</p>
        </div>
      </button>

      <button onclick="switchPage('tabungan')" class="nav-item w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-stone-700 hover:bg-teal-50 hover:text-teal-800 transition text-left" data-page="tabungan">
        <span class="text-xl">🐷</span>
        <div>
          <p class="text-sm font-semibold">Tabungan</p>
          <p class="text-xs text-stone-400">Target celengan & darurat</p>
        </div>
      </button>

      <button onclick="switchPage('ringkasan')" class="nav-item w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-stone-700 hover:bg-teal-50 hover:text-teal-800 transition text-left" data-page="ringkasan">
        <span class="text-xl">📊</span>
        <div>
          <p class="text-sm font-semibold">Ringkasan Keuangan</p>
          <p class="text-xs text-stone-400">Gambaran umum sisa saldo</p>
        </div>
      </button>

      <button onclick="switchPage('belanja')" class="nav-item w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-stone-700 hover:bg-teal-50 hover:text-teal-800 transition text-left" data-page="belanja">
        <span class="text-xl">🛒</span>
        <div>
          <p class="text-sm font-semibold">Daftar Belanja</p>
          <p class="text-xs text-stone-400">Checklist belanjaan rumah</p>
        </div>
      </button>

      <button onclick="switchPage('anggota')" class="nav-item w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-stone-700 hover:bg-teal-50 hover:text-teal-800 transition text-left" data-page="anggota">
        <span class="text-xl">👥</span>
        <div>
          <div class="flex items-center gap-2">
            <p class="text-sm font-semibold">Anggota & Linked ID</p>
            <span class="px-1.5 py-0.5 bg-amber-100 text-amber-800 text-[10px] font-bold rounded-md">Hubungkan</span>
          </div>
          <p class="text-xs text-stone-400">Hubungkan HP Pasangan</p>
        </div>
      </button>
    </nav>

    <!-- Drawer Footer -->
    <div class="p-4 bg-stone-50 border-t border-stone-100 text-xs space-y-3">
      <div class="flex items-center justify-between text-stone-500">
        <span>Status Cloud:</span>
        <span id="drawerCloudText" class="font-semibold text-amber-600">Menghubungkan...</span>
      </div>
      <div class="flex items-center justify-between text-stone-500">
        <span>ID Device Ini:</span>
        <span id="drawerDeviceId" class="font-mono font-bold text-stone-800">DK-XXXX</span>
      </div>
      <button id="btnResetDrawer" onclick="confirmResetWalletData()" class="w-full py-2 bg-red-50 hover:bg-red-100 text-red-700 font-semibold rounded-lg text-center transition">
        Reset Data Dompet Ini
      </button>
    </div>
  </aside>

  <!-- MODAL CONTAINER (Dynamic Dynamic Modals) -->
  <div id="modalContainer"></div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-stone-900 text-white px-4 py-2.5 rounded-full text-xs font-medium shadow-2xl transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2">
    <span id="toastIcon">✨</span>
    <span id="toastMsg">Pesan Toast</span>
  </div>

  <!-- FIREBASE & CORE LOGIC SCRIPT -->
  <script>
    // -----------------------------------------------------------------
    // 1. FIREBASE CONFIGURATION (EXACT MATCH USER REQUIREMENT)
    // -----------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyBDVnTPzgzHYct2P1BHEi5lRxR4RaKfvPc",
      authDomain: "dompet-keluarga-bac95.firebaseapp.com",
      databaseURL: "https://dompet-keluarga-bac95-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "dompet-keluarga-bac95",
      storageBucket: "dompet-keluarga-bac95.firebasestorage.app",
      messagingSenderId: "698410337790",
      appId: "1:698410337790:web:cbbc248f94c4e8e1d4acaf",
      measurementId: "G-KSEF93VVE0"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // -----------------------------------------------------------------
    // 2. APP STATE & LOCAL STORAGE KEYS
    // -----------------------------------------------------------------
    const KEY_IDENTITY = 'dk_identity_v4';
    const KEY_LINK = 'dk_link_v4';

    let myIdentity = null;   // { deviceId, pin }
    let linkConfig = null;   // { targetWalletId, pin, mode }
    let activeWalletId = '';
    let accessMode = 'owner'; // 'owner', 'view', 'collab'
    let isReadOnly = false;
    let isCloudOnline = false;

    let currentPage = 'pengeluaran';
    let selectedMemberId = 'saya';
    let filterPeriod = '1 Bulan';

    // Core Data Object loaded from Firebase / Cache
    let currentWallet = {
      pin: '1000',
      members: [{ id: 'saya', name: 'Saya', avatar: '👤', isOwner: true }],
      transactions: [],
      savings: [],
      shopping: [],
      updatedAt: Date.now()
    };

    let activeFirebaseListener = null;

    // -----------------------------------------------------------------
    // 3. INITIALIZATION & IDENTITY GENERATION
    // -----------------------------------------------------------------
    window.addEventListener('load', () => {
      initIdentity();
      initLinkConfig();
      setupFirebaseConnectionMonitor();
      setupWalletSync();
      switchPage('pengeluaran');
    });

    function generateRandomId() {
      const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ'; // Avoid 0, O, 1, I
      let part1 = '', part2 = '';
      for (let i = 0; i < 4; i++) {
        part1 += chars.charAt(Math.floor(Math.random() * chars.length));
        part2 += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return `DK-${part1}-${part2}`;
    }

    function generateRandomPin() {
      return Math.floor(1000 + Math.random() * 9000).toString();
    }

    function initIdentity() {
      const saved = localStorage.getItem(KEY_IDENTITY);
      if (saved) {
        try {
          myIdentity = JSON.parse(saved);
        } catch (e) { myIdentity = null; }
      }

      if (!myIdentity || !myIdentity.deviceId || !myIdentity.pin) {
        myIdentity = {
          deviceId: generateRandomId(),
          pin: generateRandomPin()
        };
        localStorage.setItem(KEY_IDENTITY, JSON.stringify(myIdentity));
      }

      document.getElementById('drawerDeviceId').innerText = myIdentity.deviceId;
    }

    function initLinkConfig() {
      const saved = localStorage.getItem(KEY_LINK);
      if (saved) {
        try {
          linkConfig = JSON.parse(saved);
        } catch (e) { linkConfig = null; }
      }

      if (!linkConfig || !linkConfig.targetWalletId) {
        linkConfig = {
          targetWalletId: myIdentity.deviceId,
          pin: myIdentity.pin,
          mode: 'owner'
        };
        localStorage.setItem(KEY_LINK, JSON.stringify(linkConfig));
      }

      applyWalletAccessMode();
    }

    function applyWalletAccessMode() {
      activeWalletId = linkConfig.targetWalletId || myIdentity.deviceId;
      if (activeWalletId === myIdentity.deviceId) {
        accessMode = 'owner';
      } else {
        accessMode = linkConfig.mode || 'view';
      }

      isReadOnly = (accessMode === 'view');
      updateLinkedBannerUI();
    }

    function updateLinkedBannerUI() {
      const banner = document.getElementById('linkedStatusBanner');
      const icon = document.getElementById('linkedBannerIcon');
      const text = document.getElementById('linkedBannerText');
      const btnAddMemberBar = document.getElementById('btnAddMemberBar');

      if (accessMode === 'owner') {
        banner.classList.add('hidden');
        if (btnAddMemberBar) btnAddMemberBar.classList.remove('hidden');
      } else {
        banner.classList.remove('hidden');
        if (accessMode === 'view') {
          icon.innerText = '👁️';
          text.innerText = `Mode Pantau (Baca Saja) • ${activeWalletId}`;
          if (btnAddMemberBar) btnAddMemberBar.classList.add('hidden');
        } else {
          icon.innerText = '🤝';
          text.innerText = `Mode Bareng (Catat Bersama) • ${activeWalletId}`;
          if (btnAddMemberBar) btnAddMemberBar.classList.remove('hidden');
        }
      }
    }

    // -----------------------------------------------------------------
    // 4. FIREBASE SYNC & DATA NORMALIZER
    // -----------------------------------------------------------------
    function setupFirebaseConnectionMonitor() {
      const dot = document.getElementById('cloudStatusDot');
      const drawerCloud = document.getElementById('drawerCloudText');

      db.ref('.info/connected').on('value', (snap) => {
        isCloudOnline = (snap.val() === true);
        if (isCloudOnline) {
          dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block shadow-sm';
          dot.title = 'Terhubung ke Cloud Firebase (Aktif)';
          drawerCloud.innerText = 'Online 🟢';
          drawerCloud.className = 'font-semibold text-emerald-600';
        } else {
          dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse inline-block';
          dot.title = 'Offline / Menghubungkan...';
          drawerCloud.innerText = 'Offline 🟡';
          drawerCloud.className = 'font-semibold text-amber-600';
        }
      });
    }

    function toArray(val) {
      if (!val) return [];
      if (Array.isArray(val)) return val.filter(Boolean);
      if (typeof val === 'object') return Object.values(val);
      return [];
    }

    function normalizeWalletData(raw) {
      return {
        pin: raw && raw.pin ? String(raw.pin) : (activeWalletId === myIdentity.deviceId ? myIdentity.pin : '1000'),
        members: toArray(raw?.members).length ? toArray(raw.members) : [{ id: 'saya', name: 'Saya', avatar: '👤', isOwner: true }],
        transactions: toArray(raw?.transactions),
        savings: toArray(raw?.savings),
        shopping: toArray(raw?.shopping),
        updatedAt: raw?.updatedAt || Date.now()
      };
    }

    function setupWalletSync() {
      // Load local cache first for instant rendering
      const cached = localStorage.getItem(`dk_cache_v4_${activeWalletId}`);
      if (cached) {
        try {
          currentWallet = normalizeWalletData(JSON.parse(cached));
          renderUI();
        } catch (e) {}
      }

      // Detach old listener
      if (activeFirebaseListener) {
        db.ref(`dompet/${activeWalletId}`).off('value', activeFirebaseListener);
      }

      // Attach new listener
      activeFirebaseListener = db.ref(`dompet/${activeWalletId}`).on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          currentWallet = normalizeWalletData(val);
          localStorage.setItem(`dk_cache_v4_${activeWalletId}`, JSON.stringify(currentWallet));
          renderUI();
        } else {
          // Node does not exist yet. If my own device, initialize it on Firebase
          if (activeWalletId === myIdentity.deviceId) {
            currentWallet = {
              pin: myIdentity.pin,
              members: [{ id: 'saya', name: 'Saya', avatar: '👤', isOwner: true }],
              transactions: [],
              savings: [],
              shopping: [],
              updatedAt: Date.now()
            };
            saveWalletToFirebase();
          } else {
            // Linked wallet deleted or invalid
            showToast('⚠️ Data dompet terhubung tidak ditemukan.');
          }
        }
      });
    }

    function saveWalletToFirebase() {
      if (isReadOnly) {
        showToast('🔒 Mode Pantau: Tidak dapat menyimpan data.');
        return Promise.reject('Read-only mode');
      }

      currentWallet.updatedAt = Date.now();
      localStorage.setItem(`dk_cache_v4_${activeWalletId}`, JSON.stringify(currentWallet));

      return db.ref(`dompet/${activeWalletId}`).set(currentWallet).catch((err) => {
        console.error('Firebase save error:', err);
        showToast('⚠️ Gagal menyimpan ke cloud. Menunggu koneksi...');
      });
    }

    // -----------------------------------------------------------------
    // 5. NAVIGATION & UI RENDERING
    // -----------------------------------------------------------------
    function toggleDrawer(open) {
      const drawer = document.getElementById('drawer');
      const overlay = document.getElementById('drawerOverlay');
      if (open) {
        overlay.classList.remove('opacity-0', 'pointer-events-none');
        drawer.classList.remove('translate-x-full');
      } else {
        overlay.classList.add('opacity-0', 'pointer-events-none');
        drawer.classList.add('translate-x-full');
      }

      // Hide or disable Reset button in drawer if read-only
      const btnReset = document.getElementById('btnResetDrawer');
      if (btnReset) {
        if (isReadOnly) btnReset.classList.add('hidden');
        else btnReset.classList.remove('hidden');
      }
    }

    function switchPage(page) {
      currentPage = page;
      toggleDrawer(false);

      // Update active nav button highlighting
      document.querySelectorAll('.nav-item').forEach(btn => {
        if (btn.dataset.page === page) {
          btn.classList.add('bg-teal-50', 'text-teal-800', 'font-bold');
        } else {
          btn.classList.remove('bg-teal-50', 'text-teal-800', 'font-bold');
        }
      });

      // Update subtitle header
      const titleMap = {
        'pengeluaran': 'Pengeluaran 💸',
        'pemasukan': 'Pemasukan 💰',
        'tabungan': 'Tabungan 🐷',
        'ringkasan': 'Ringkasan Keuangan 📊',
        'belanja': 'Daftar Belanja 🛒',
        'anggota': 'Anggota & Linked ID 👥'
      };
      document.getElementById('headerSubtitle').innerText = titleMap[page] || '';

      renderUI();
    }

    function renderUI() {
      renderMemberChips();
      const container = document.getElementById('mainContainer');

      switch (currentPage) {
        case 'pengeluaran':
          renderPengeluaran(container);
          break;
        case 'pemasukan':
          renderPemasukan(container);
          break;
        case 'tabungan':
          renderTabungan(container);
          break;
        case 'ringkasan':
          renderRingkasan(container);
          break;
        case 'belanja':
          renderBelanja(container);
          break;
        case 'anggota':
          renderAnggota(container);
          break;
      }
    }

    function renderMemberChips() {
      const container = document.getElementById('memberChipContainer');
      const members = currentWallet.members || [];

      // Ensure active selected member exists
      if (!members.find(m => m.id === selectedMemberId)) {
        selectedMemberId = members[0]?.id || 'saya';
      }

      container.innerHTML = members.map(m => {
        const isSelected = m.id === selectedMemberId;
        return `
          <button onclick="selectMember('${m.id}')" class="shrink-0 px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5 transition ${isSelected ? 'bg-teal-700 text-white shadow-sm' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}">
            <span>${m.avatar || '👤'}</span>
            <span>${m.name}</span>
          </button>
        `;
      }).join('');
    }

    function selectMember(id) {
      selectedMemberId = id;
      renderMemberChips();
    }

    // Format currency Rp 0
    function formatRp(num) {
      const val = Math.round(Number(num) || 0);
      return 'Rp ' + val.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }

    // Auto format input nominal while typing
    function formatInputCurrency(input) {
      let raw = input.value.replace(/\D/g, '');
      if (!raw) {
        input.value = '';
        return;
      }
      input.value = parseInt(raw, 10).toLocaleString('id-ID');
    }

    function parseInputCurrency(val) {
      return parseInt(String(val).replace(/\D/g, ''), 10) || 0;
    }

    // Date Filter Logic helper
    function filterTransactionsByPeriod(txList, period) {
      const now = new Date();
      let cutoff = new Date();

      if (period === '7 Hari') cutoff.setDate(now.getDate() - 7);
      else if (period === '1 Bulan') cutoff.setMonth(now.getMonth() - 1);
      else if (period === '3 Bulan') cutoff.setMonth(now.getMonth() - 3);
      else if (period === '6 Bulan') cutoff.setMonth(now.getMonth() - 6);
      else if (period === '1 Tahun') cutoff.setFullYear(now.getFullYear() - 1);

      return txList.filter(t => new Date(t.date) >= cutoff);
    }

    function connectToTargetWallet() {
      const targetId = document.getElementById('inputTargetId').value.trim().toUpperCase();
      const targetPin = document.getElementById('inputTargetPin').value.trim();
      const targetMode = document.getElementById('selectTargetMode').value;

      if (!targetId || !targetPin) {
        showToast('⚠️ Mohon isi ID dan PIN tujuan.');
        return;
      }

      showToast('🔍 Memeriksa ID di cloud...');

      // Validate node once from Firebase
      db.ref(`dompet/${targetId}`).once('value').then(snap => {
        const val = snap.val();
        if (!val) {
          showToast('❌ ID Dompet tidak ditemukan di cloud.');
          return;
        }

        if (String(val.pin) !== String(targetPin)) {
          showToast('❌ PIN 4 Digit salah.');
          return;
        }

        // Match success! Save link config
        linkConfig = {
          targetWalletId: targetId,
          pin: targetPin,
          mode: targetMode
        };
        localStorage.setItem(KEY_LINK, JSON.stringify(linkConfig));

        applyWalletAccessMode();
        setupWalletSync();

        showToast('🎉 Berhasil terhubung ke dompet keluarga!');
      }).catch(err => {
        console.error(err);
        showToast('⚠️ Periksa koneksi internet Anda.');
      });
    }

    function compressReceiptImage(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const max = 500; // max dimension 500px to keep base64 tiny

          if (width > height) {
            if (width > max) {
              height = Math.round((height *= max / width));
              width = max;
            }
          } else {
            if (height > max) {
              width = Math.round((width *= max / height));
              height = max;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressed = canvas.toDataURL('image/jpeg', 0.55);
          document.getElementById('hiddenReceiptBase64').value = compressed;
          document.getElementById('imgReceiptPreview').src = compressed;
          document.getElementById('receiptPreviewContainer').classList.remove('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

                ${isDeposit ? '➕ Setor Tabungan' : '➖ Tarik Tabungan'}
              </h3>
              <button onclick="closeModal('modalDeposit')" class="text-stone-400 hover:text-stone-700">✕</button>
            </div>

            <p class="text-xs text-stone-500">Target: <b>${item.name}</b> (Terkumpul: ${formatRp(item.current)})</p>

            <form onsubmit="submitDeposit(event, '${savingId}', '${mode}')" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-stone-500 mb-1">Nominal (Rp)</label>
                <input type="text" id="inputDepositAmount" required inputmode="numeric" placeholder="0" oninput="formatInputCurrency(this)" class="w-full text-2xl font-black text-stone-900 border-2 border-amber-400 rounded-xl px-3 py-2 text-center focus:outline-none">
              </div>

              <button type="submit" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl text-sm transition shadow-md">
                ${isDeposit ? 'Simpan Setoran' : 'Tarik Saldo'}
              </button>
            </form>
          </div>
        </div>
      `;
      document.getElementById('modalContainer').innerHTML = modalHtml;
    }

    function submitDeposit(e, id, mode) {
      e.preventDefault();
      if (isReadOnly) return;

      const amt = parseInputCurrency(document.getElementById('inputDepositAmount').value);
      const item = (currentWallet.savings || []).find(s => s.id === id);
      if (!item) return;

      if (mode === 'deposit') {
        item.current = Number(item.current || 0) + amt;
      } else {
        item.current = Math.max(0, Number(item.current || 0) - amt);
      }

      saveWalletToFirebase().then(() => {
        showToast(mode === 'deposit' ? '🎉 Setoran tabungan berhasil!' : '💸 Penarikan tabungan berhasil');
        closeModal('modalDeposit');
        renderUI();
      });
    }

    function deleteSaving(id) {
      if (isReadOnly) return;
      currentWallet.savings = (currentWallet.savings || []).filter(s => s.id !== id);
      saveWalletToFirebase().then(() => showToast('🗑️ Target tabungan dihapus'));
    }

    // Modal Anggota Keluarga
    function openAddMemberModal() {
      if (isReadOnly) return;
      const modalHtml = `
        <div id="modalMember" class="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b pb-3">
              <h3 class="font-extrabold text-stone-900 text-base">👤 Tambah Anggota Keluarga</h3>
              <button onclick="closeModal('modalMember')" class="text-stone-400 hover:text-stone-700">✕</button>
            </div>

            <form onsubmit="submitAddMember(event)" class="space-y-3">
              <div>
                <label class="block text-xs font-semibold text-stone-500 mb-1">Nama Profil (misal: Suami, Istri, Anak)</label>
                <input type="text" id="inputMemberName" required placeholder="Nama anggota..." class="w-full border border-stone-200 rounded-xl px-3 py-2 text-sm text-stone-800 focus:outline-none">
              </div>

              <div>
                <label class="block text-xs font-semibold text-stone-500 mb-1">Pilih Avatar Emoji</label>
                <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar py-1">
                  ${['👨', '👩', '👦', '👧', '👴', '👵', '👶', '🐱'].map(a => `
                    <label class="cursor-pointer">
                      <input type="radio" name="avatarRadio" value="${a}" class="peer hidden" ${a==='👨'?'checked':''}>
                      <span class="w-10 h-10 rounded-xl border border-stone-200 flex items-center justify-center text-xl peer-checked:border-teal-600 peer-checked:bg-teal-50 transition">${a}</span>
                    </label>
                  `).join('')}
                </div>
              </div>

              <button type="submit" class="w-full py-3 bg-brand-green hover:bg-brand-greenDark text-white font-bold rounded-xl text-sm transition shadow-md">
                Tambah Profil Anggota
              </button>
            </form>
          </div>
        </div>
      `;
      document.getElementById('modalContainer').innerHTML = modalHtml;
    }

    function submitAddMember(e) {
      e.preventDefault();
      if (isReadOnly) return;

      const name = document.getElementById('inputMemberName').value.trim();
      const avatarRadios = document.getElementsByName('avatarRadio');
      let avatar = '👤';
      for (let r of avatarRadios) { if (r.checked) avatar = r.value; }

      if (!currentWallet.members) currentWallet.members = [];
      currentWallet.members.push({
        id: 'mem_' + Date.now(),
        name: name,
        avatar: avatar,
        isOwner: false
      });

      saveWalletToFirebase().then(() => {
        showToast('👤 Profil anggota ditambahkan');
        closeModal('modalMember');
        renderUI();
      });
    }

    function deleteMember(id) {
      if (isReadOnly) return;
      currentWallet.members = (currentWallet.members || []).filter(m => m.id !== id);
      saveWalletToFirebase().then(() => showToast('🗑️ Profil anggota dihapus'));
    }

    // Change PIN Modal
    function openChangePinModal() {
      const modalHtml = `
        <div id="modalPin" class="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b pb-3">
              <h3 class="font-extrabold text-stone-900 text-base">🔑 Ubah PIN Keamanan</h3>
              <button onclick="closeModal('modalPin')" class="text-stone-400 hover:text-stone-700">✕</button>
            </div>

            <form onsubmit="submitChangePin(event)" class="space-y-3">
              <div>
                <label class="block text-xs font-semibold text-stone-500 mb-1">PIN Baru (4 Digit)</label>
                <input type="password" id="inputNewPin" maxlength="4" required inputmode="numeric" placeholder="****" class="w-full border border-stone-200 rounded-xl px-3 py-2 text-center text-xl font-mono font-bold text-stone-900 focus:outline-none">
              </div>

              <button type="submit" class="w-full py-3 bg-brand-green hover:bg-brand-greenDark text-white font-bold rounded-xl text-sm transition shadow-md">
                Simpan PIN Baru
              </button>
            </form>
          </div>
        </div>
      `;
      document.getElementById('modalContainer').innerHTML = modalHtml;
    }

    function submitChangePin(e) {
      e.preventDefault();
      const pin = document.getElementById('inputNewPin').value.trim();
      if (pin.length !== 4) {
        showToast('⚠️ PIN harus 4 digit angka.');
        return;
      }

      myIdentity.pin = pin;
      localStorage.setItem(KEY_IDENTITY, JSON.stringify(myIdentity));
      currentWallet.pin = pin;

      saveWalletToFirebase().then(() => {
        showToast('🔑 PIN berhasil diperbarui!');
        closeModal('modalPin');
        renderUI();
      });
    }

    // Preview Image Modal
    function previewImage(src) {
      const modalHtml = `
        <div id="modalImg" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeModal('modalImg')">
          <div class="relative max-w-full max-h-full">
            <img src="${src}" class="max-w-full max-h-[85vh] rounded-2xl shadow-2xl object-contain">
            <p class="text-center text-xs text-white/70 mt-2">Ketuk di mana saja untuk menutup</p>
          </div>
        </div>
      `;
      document.getElementById('modalContainer').innerHTML = modalHtml;
    }

    // Reset Data Modal
    function confirmResetWalletData() {
      if (isReadOnly) return;
      const modalHtml = `
        <div id="modalReset" class="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="bg-white w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-2xl text-center">
            <span class="text-4xl block">⚠️</span>
            <h3 class="font-extrabold text-stone-900 text-base">Reset Data Dompet Ini?</h3>
            <p class="text-xs text-stone-500">Semua transaksi, tabungan, dan belanjaan akan dihapus bersih mulai dari Rp 0 kembali.</p>

            <div class="grid grid-cols-2 gap-2 pt-2">
              <button onclick="closeModal('modalReset')" class="py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold rounded-xl text-xs transition">
                Batal
              </button>
              <button onclick="executeResetWalletData()" class="py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs transition">
                Ya, Reset Total
              </button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('modalContainer').innerHTML = modalHtml;
    }

    function executeResetWalletData() {
      if (isReadOnly) return;
      currentWallet = {
        pin: myIdentity.pin,
        members: [{ id: 'saya', name: 'Saya', avatar: '👤', isOwner: true }],
        transactions: [],
        savings: [],
        shopping: [],
        updatedAt: Date.now()
      };

      saveWalletToFirebase().then(() => {
        showToast('🧹 Data dompet telah direset murni.');
        closeModal('modalReset');
        toggleDrawer(false);
        renderUI();
      });
    }

    function closeModal(modalId) {
      const modal = document.getElementById(modalId);
      if (modal) modal.remove();
    }

    // Toast Utility
    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = msg;

      toast.classList.remove('opacity-0', 'pointer-events-none');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 3000);
    }

    // Helper to copy to clipboard safely
    function copyToClipboard(text, successMsg) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => showToast(successMsg));
      } else {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-999999px';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          showToast(successMsg);
        } catch (err) {
          showToast('⚠️ Gagal menyalin.');
        }
        document.body.removeChild(textArea);
      }
    }
  </script>
</body>
</html>

  <!-- JAVASCRIPT APPLICATION CODE -->
  <script>
    // ==========================================
    // 1. FIREBASE INITIALIZATION EKSAT
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyBDVnTPzgzHYct2P1BHEi5lRxR4RaKfvPc",
      authDomain: "dompet-keluarga-bac95.firebaseapp.com",
      databaseURL: "https://dompet-keluarga-bac95-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "dompet-keluarga-bac95",
      storageBucket: "dompet-keluarga-bac95.firebasestorage.app",
      messagingSenderId: "698410337790",
      appId: "1:698410337790:web:cbbc248f94c4e8e1d4acaf",
      measurementId: "G-KSEF93VVE0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ==========================================
    // 2. HELPER UTILITIES & DATE FUNCTIONS
    // ==========================================
    // WAJIB: getLocalTodayStr menggunakan jam & tanggal lokal HP (UTC+7 / WIB)
    function getLocalTodayStr() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function formatRupiah(amount) {
      const val = parseInt(amount) || 0;
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(val);
    }

    function formatCompactRupiah(amount) {
      const num = parseInt(amount) || 0;
      if (num === 0) return '';
      if (num >= 1000000000) return (num / 1000000000).toFixed(1).replace('.0', '') + 'M';
      if (num >= 1000000) return (num / 1000000).toFixed(1).replace('.0', '') + 'jt';
      if (num >= 1000) return (num / 1000).toFixed(0) + 'rb';
      return num.toString();
    }

    function formatDateIndo(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const days = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agus', 'Sep', 'Okt', 'Nov', 'Des'];
      return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-stone-800';
      toast.className = `${bgClass} text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg transition-all transform translate-y-4 opacity-0 pointer-events-auto flex items-center space-x-2`;
      toast.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '⚠️' : 'ℹ️'}</span><span>${message}</span>`;
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.remove('translate-y-4', 'opacity-0');
      }, 50);

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // ==========================================
    // 3. FITUR KRUSIAL #1 — ANTI LOSS & MIGRATION SCANNER
    // ==========================================
    const PERMANENT_KEYS = {
      DEVICE_ID: 'DK_PERMANENT_DEVICE_ID',
      PIN: 'DK_PERMANENT_PIN',
      LINKED: 'DK_PERMANENT_LINKED',
      CACHE: 'DK_PERMANENT_CACHE'
    };

    function generateNewWalletID() {
      const randStr = Math.random().toString(36).substring(2, 7).toUpperCase();
      const timeStr = Date.now().toString(36).substring(4).toUpperCase();
      return `DK-${randStr}${timeStr}`;
    }

    // AUTO-SCANNER MIGRASI SAAT Halaman Pertama Ditampil
    function autoScanAndMigrateLocalStorage() {
      let existingID = localStorage.getItem(PERMANENT_KEYS.DEVICE_ID);
      
      if (!existingID) {
        console.log("Mulai memindai localStorage lama...");
        let foundOldID = null;

        // Scan seluruh key di window.localStorage
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          const val = localStorage.getItem(key);
          
          // Pattern matching DK-XXXX
          const match = val && val.match(/DK-[A-Z0-9-]{4,}/i);
          if (match) {
            foundOldID = match[0].toUpperCase();
            console.log("Menemukan ID perangkat lama:", foundOldID);
            break;
          }
        }

        if (foundOldID) {
          existingID = foundOldID;
        } else {
          existingID = generateNewWalletID();
        }
        localStorage.setItem(PERMANENT_KEYS.DEVICE_ID, existingID);
      }

      // Pastikan ada PIN default "1234" jika belum ada
      if (!localStorage.getItem(PERMANENT_KEYS.PIN)) {
        localStorage.setItem(PERMANENT_KEYS.PIN, '1234');
      }

      return existingID;
    }

    // ==========================================
    // 4. GLOBAL STATE APPLICATION
    // ==========================================
    const walletId = autoScanAndMigrateLocalStorage();
    let currentAppTodayDate = getLocalTodayStr(); // Local date tracker

    let appState = {
      activePage: 'pengeluaran', // pengeluaran, pemasukan, tabungan, ringkasan, belanja, anggota
      activeMemberId: 'all', // 'all' or member ID
      filterMode: 'today', // today, single, range, 7d, 1m, 3m, 6m, 1y
      selectedStartDate: currentAppTodayDate,
      selectedEndDate: currentAppTodayDate,
      calendarMonth: new Date().getMonth(),
      calendarYear: new Date().getFullYear(),
      
      // Data Murni dari Rp 0
      members: [
        { id: 'saya', name: 'Saya', emoji: '👤' }
      ],
      transactions: [], // {id, type:'expense'|'income', amount, category, memberId, date, note, photo}
      savings: [],      // {id, title, target, current, history:[{date, amount, type:'deposit'|'withdraw'}]}
      shopping: []      // {id, text, done, price, date}
    };

    let isCloudInitialized = false;
    let firebaseDbRef = null;

    // Load initial data from permanent cache if available
    try {
      const cached = localStorage.getItem(PERMANENT_KEYS.CACHE);
      if (cached) {
        const parsed = JSON.parse(cached);
        if (parsed.transactions) appState.transactions = parsed.transactions;
        if (parsed.members) appState.members = parsed.members;
        if (parsed.savings) appState.savings = parsed.savings;
        if (parsed.shopping) appState.shopping = parsed.shopping;
      }
    } catch(e) { console.error(e); }

    // ==========================================
    // 5. FITUR KRUSIAL #3 — ZERO-OVERWRITE CLOUD SYNC
    // ==========================================
    function initFirebaseCloudSync() {
      const statusDot = document.getElementById('cloudStatusDot');
      const drawerSyncText = document.getElementById('drawerSyncText');

      // Check if linked to another ID
      const linkedID = localStorage.getItem(PERMANENT_KEYS.LINKED) || walletId;
      document.getElementById('drawerWalletIDText').innerText = `ID: ${linkedID}`;

      firebaseDbRef = db.ref(`dompet/${linkedID}`);

      // Listener pembacaan awal
      firebaseDbRef.on('value', (snapshot) => {
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block";
        statusDot.title = "Terhubung ke Realtime Cloud";
        drawerSyncText.innerText = "Terhubung ke Cloud";
        drawerSyncText.className = "font-bold text-emerald-600";

        if (snapshot.exists()) {
          const data = snapshot.val();
          if (data) {
            appState.transactions = data.transactions || [];
            appState.members = data.members || [{ id: 'saya', name: 'Saya', emoji: '👤' }];
            appState.savings = data.savings || [];
            appState.shopping = data.shopping || [];
            saveLocalCache();
            renderApp();
          }
        } else {
          // ZERO-OVERWRITE: Cloud node belum ada. Jika kita punya data lokal, unggah data lokal ke cloud!
          if (appState.transactions.length > 0 || appState.savings.length > 0 || appState.shopping.length > 0) {
            pushToCloud();
          }
        }
        isCloudInitialized = true;
      }, (error) => {
        console.error("Firebase Error:", error);
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-yellow-400 inline-block";
        statusDot.title = "Mode Offline / Lokal";
        drawerSyncText.innerText = "Mode Offline";
        drawerSyncText.className = "font-bold text-yellow-600";
        isCloudInitialized = true;
      });
    }

    function saveLocalCache() {
      try {
        localStorage.setItem(PERMANENT_KEYS.CACHE, JSON.stringify({
          transactions: appState.transactions,
          members: appState.members,
          savings: appState.savings,
          shopping: appState.shopping
        }));
      } catch(e) { console.error(e); }
    }

    function pushToCloud() {
      saveLocalCache();
      if (firebaseDbRef && isCloudInitialized) {
        firebaseDbRef.set({
          transactions: appState.transactions,
          members: appState.members,
          savings: appState.savings,
          shopping: appState.shopping,
          updatedAt: firebase.database.ServerValue.TIMESTAMP
        });
      }
    }

    // ==========================================
    // 6. FITUR KRUSIAL #2 — AUTO ROLLOVER MIDNIGHT REALTIME
    // ==========================================
    function checkMidnightRollover() {
      const latestToday = getLocalTodayStr();
      if (latestToday !== currentAppTodayDate) {
        console.log("Hari baru terdeteksi:", latestToday);
        currentAppTodayDate = latestToday;
        
        // Jika mode filter sedang di 'today', otomatis ganti tanggal aktif ke hari baru
        if (appState.filterMode === 'today') {
          appState.selectedStartDate = currentAppTodayDate;
          appState.selectedEndDate = currentAppTodayDate;
        }

        appState.calendarMonth = new Date().getMonth();
        appState.calendarYear = new Date().getFullYear();

    // ==========================================
    // 7. COMPRESS FOTO STRUK AUTOMATIS (CANVAS MAX 600px, JPEG 0.6)
    // ==========================================
    function compressPhotoFile(file, callback) {
      if (!file) return callback(null);
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 600;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // Quality 0.6 JPEG
          const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
          callback(dataUrl);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function renderCalendar() {
      const monthYearText = document.getElementById('calendarMonthYear');
      const daysGrid = document.getElementById('calendarDaysGrid');
      const activeLabel = document.getElementById('calendarActiveLabel');
      const liveBadge = document.getElementById('liveStatusBadge');
      const btnQuickToday = document.getElementById('btnQuickToday');

      const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      monthYearText.innerText = `${monthNames[appState.calendarMonth]} ${appState.calendarYear}`;

      // Live indicator text & quick today button visibility
      if (appState.filterMode === 'today') {
        liveBadge.classList.remove('hidden');
        btnQuickToday.classList.add('hidden');
        activeLabel.innerText = `Hari Ini • ${formatDateIndo(currentAppTodayDate)}`;
      } else {
        liveBadge.classList.add('hidden');
        btnQuickToday.classList.remove('hidden');

        if (appState.filterMode === 'single') {
          activeLabel.innerText = formatDateIndo(appState.selectedStartDate);
        } else if (appState.selectedStartDate && appState.selectedEndDate) {
          activeLabel.innerText = `${formatDateIndo(appState.selectedStartDate)} - ${formatDateIndo(appState.selectedEndDate)}`;
        }
      }

      // Calculate totals per date for calendar display
      const totalsPerDate = {};
      appState.transactions.forEach(t => {
        if (appState.activeMemberId !== 'all' && t.memberId !== appState.activeMemberId) return;
        
        // Show expense totals on expense page, income totals on income page
        if (appState.activePage === 'pemasukan' && t.type !== 'income') return;
        if (appState.activePage !== 'pemasukan' && t.type !== 'expense') return;

        totalsPerDate[t.date] = (totalsPerDate[t.date] || 0) + (parseInt(t.amount) || 0);
      });

      // Build Calendar Grid Days
      const firstDay = new Date(appState.calendarYear, appState.calendarMonth, 1).getDay();
      const daysInMonth = new Date(appState.calendarYear, appState.calendarMonth + 1, 0).getDate();

      let gridHtml = '';

      // Blank slots before first day
      for (let i = 0; i < firstDay; i++) {
        gridHtml += `<div class="p-2"></div>`;
      }

      // Days loop
      for (let day = 1; day <= daysInMonth; day++) {
        const mm = String(appState.calendarMonth + 1).padStart(2, '0');
        const dd = String(day).padStart(2, '0');
        const dateStr = `${appState.calendarYear}-${mm}-${dd}`;

        const isToday = (dateStr === currentAppTodayDate);
        const total = totalsPerDate[dateStr] || 0;
        const compactAmt = formatCompactRupiah(total);

        // Highlight Range Logic
        let isSelected = false;
        let isInRange = false;

        if (appState.selectedStartDate && appState.selectedEndDate) {
          if (dateStr >= appState.selectedStartDate && dateStr <= appState.selectedEndDate) {
            isInRange = true;
          }
        }
        if (dateStr === appState.selectedStartDate || dateStr === appState.selectedEndDate) {
          isSelected = true;
        }

        let bgClass = 'bg-stone-50 text-stone-700 hover:bg-stone-100';
        if (isSelected) {
          bgClass = 'bg-[#1E7B5E] text-white font-bold shadow-md scale-105';
        } else if (isInRange) {
          bgClass = 'bg-emerald-100 text-emerald-900 font-semibold';
        } else if (isToday) {
          bgClass = 'border-2 border-[#1E7B5E] text-[#1E7B5E] font-bold bg-emerald-50/50';
        }

        gridHtml += `
          <button data-date="${dateStr}" class="p-1.5 rounded-xl flex flex-col items-center justify-between min-h-[46px] transition ${bgClass}">
            <span class="text-xs">${day}</span>
            <span class="text-[9px] font-extrabold ${isSelected ? 'text-emerald-100' : 'text-emerald-700'} tracking-tight">${compactAmt}</span>
          </button>
        `;
      }

      daysGrid.innerHTML = gridHtml;

      // Event Listeners for Date Click Interaction
      daysGrid.querySelectorAll('button[data-date]').forEach(btn => {
        btn.addEventListener('click', () => {
          const clickedDate = btn.getAttribute('data-date');
          
          if (!appState.selectedStartDate || appState.filterMode === 'today' || (appState.selectedStartDate && appState.selectedEndDate && appState.filterMode === 'range')) {
            // First click or reset to single
            appState.filterMode = 'single';
            appState.selectedStartDate = clickedDate;
            appState.selectedEndDate = clickedDate;
          } else if (appState.selectedStartDate && !appState.selectedEndDate) {
            if (clickedDate >= appState.selectedStartDate) {
              appState.filterMode = 'range';
              appState.selectedEndDate = clickedDate;
            } else {
              appState.filterMode = 'single';
              appState.selectedStartDate = clickedDate;
              appState.selectedEndDate = clickedDate;
            }
          } else {
            appState.filterMode = 'single';
            appState.selectedStartDate = clickedDate;
            appState.selectedEndDate = clickedDate;
          }

          renderApp();
        });
      });
    }

    // ==========================================
    // 9. FILTER TRANSACTIONS UTILITY
    // ==========================================
    function getFilteredTransactions() {
      return appState.transactions.filter(t => {
        // Filter Member
        if (appState.activeMemberId !== 'all' && t.memberId !== appState.activeMemberId) return false;

        // Filter Date Range
        if (appState.selectedStartDate && appState.selectedEndDate) {
          return t.date >= appState.selectedStartDate && t.date <= appState.selectedEndDate;
        }
        return true;
      });
    }

    // ==========================================
    // 11. EVENT BINDING ENGINE FOR DOM
    // ==========================================
    function bindPageEvents() {
      // --- Expense Page Events ---
      const btnOpenExpenseModal = document.getElementById('btnOpenExpenseModal');
      if (btnOpenExpenseModal) btnOpenExpenseModal.addEventListener('click', promptExpenseModal);

      // --- Income Page Events ---
      const btnOpenIncomeModal = document.getElementById('btnOpenIncomeModal');
      if (btnOpenIncomeModal) btnOpenIncomeModal.addEventListener('click', promptIncomeModal);

      // --- Savings Page Events ---
      const btnAddSavingsModal = document.getElementById('btnAddSavingsModal');
      if (btnAddSavingsModal) btnAddSavingsModal.addEventListener('click', promptAddSavingsModal);

      document.querySelectorAll('.btn-action-savings').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-savings-id');
          const action = btn.getAttribute('data-action');
          promptSavingsAction(id, action);
        });
      });

      document.querySelectorAll('[data-delete-savings]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-delete-savings');
          promptConfirmModal("Hapus Celengan", "Apakah Anda yakin ingin menghapus celengan ini?", () => {
            appState.savings = appState.savings.filter(s => s.id !== id);
            pushToCloud();
            renderApp();
            showToast("Celengan dihapus", "info");
          });
        });
      });

      // --- Shopping Page Events ---
      const formAddShopping = document.getElementById('formAddShopping');
      if (formAddShopping) {
        formAddShopping.addEventListener('submit', (e) => {
          e.preventDefault();
          const txt = document.getElementById('inputShoppingItem').value.trim();
          if (txt) {
            appState.shopping.push({
              id: 'shop_' + Date.now(),
              text: txt,
              done: false,
              price: 0,
              date: getLocalTodayStr()
            });
            pushToCloud();
            renderApp();
            showToast("Item ditambahkan ke daftar belanja", "success");
          }
        });
      }

      document.querySelectorAll('.chk-shopping').forEach(chk => {
        chk.addEventListener('change', (e) => {
          const id = chk.getAttribute('data-shopping-id');
          const item = appState.shopping.find(s => s.id === id);
          if (item) {
            item.done = chk.checked;
            if (item.done) {
              // Open modal asking for price to convert into Expense transaction
              promptShoppingPriceModal(item);
            } else {
              pushToCloud();
              renderApp();
            }
          }
        });
      });

      document.querySelectorAll('[data-delete-shopping]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-delete-shopping');
          appState.shopping = appState.shopping.filter(s => s.id !== id);
          pushToCloud();
          renderApp();
        });
      });

      // --- Member & Settings Events ---
      const btnOpenAddMember = document.getElementById('btnOpenAddMember');
      if (btnOpenAddMember) btnOpenAddMember.addEventListener('click', promptAddMemberModal);

      document.querySelectorAll('[data-delete-member]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-delete-member');
          promptConfirmModal("Hapus Anggota", "Yakin ingin menghapus anggota ini?", () => {
            appState.members = appState.members.filter(m => m.id !== id);
            pushToCloud();
            renderApp();
            showToast("Anggota dihapus", "info");
          });
        });
      });

      const btnCopyID = document.getElementById('btnCopyID');
      if (btnCopyID) {
        btnCopyID.addEventListener('click', () => {
          const copyText = walletId;
          const dummy = document.createElement("textarea");
          document.body.appendChild(dummy);
          dummy.value = copyText;
          dummy.select();
          document.execCommand("copy");
          document.body.removeChild(dummy);
          showToast("ID Perangkat telah disalin!", "success");
        });
      }

      const btnChangePin = document.getElementById('btnChangePin');
      if (btnChangePin) {
        btnChangePin.addEventListener('click', promptChangePinModal);
      }

      const formLinkWallet = document.getElementById('formLinkWallet');
      if (formLinkWallet) {
        formLinkWallet.addEventListener('submit', (e) => {
          e.preventDefault();
          const targetID = document.getElementById('inputTargetID').value.trim().toUpperCase();
          if (targetID) {
            localStorage.setItem(PERMANENT_KEYS.LINKED, targetID);
            showToast(`Dompet berhasil dihubungkan ke ${targetID}`, 'success');
            setTimeout(() => window.location.reload(), 800);
          }
        });
      }

      const btnDisconnectLinked = document.getElementById('btnDisconnectLinked');
      if (btnDisconnectLinked) {
        btnDisconnectLinked.addEventListener('click', () => {
          promptConfirmModal("Putuskan Koneksi", "Kembali ke dompet lokal sendiri?", () => {
            localStorage.removeItem(PERMANENT_KEYS.LINKED);
            showToast("Koneksi diputuskan", "info");
            setTimeout(() => window.location.reload(), 800);
          });
        });
      }

      const btnToggleRestoreSection = document.getElementById('btnToggleRestoreSection');
      if (btnToggleRestoreSection) {
        btnToggleRestoreSection.addEventListener('click', () => {
          const content = document.getElementById('restoreSectionContent');
          content.classList.toggle('hidden');
        });
      }

      const btnApplyRestoreID = document.getElementById('btnApplyRestoreID');
      if (btnApplyRestoreID) {
        btnApplyRestoreID.addEventListener('click', () => {
          const restoreID = document.getElementById('inputOldRestoreID').value.trim().toUpperCase();
          if (restoreID && restoreID.startsWith('DK-')) {
            localStorage.setItem(PERMANENT_KEYS.DEVICE_ID, restoreID);
            localStorage.removeItem(PERMANENT_KEYS.LINKED);
            showToast(`ID Perangkat berhasil dipulihkan ke ${restoreID}`, 'success');
            setTimeout(() => window.location.reload(), 800);
          } else {
            showToast("Format ID harus diawali DK-", "error");
          }
        });
      }

      // --- Transaction Item Events (Delete & Photo) ---
      document.querySelectorAll('[data-delete-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-delete-id');
          promptConfirmModal("Hapus Catatan", "Apakah Anda yakin ingin menghapus transaksi ini?", () => {
            appState.transactions = appState.transactions.filter(t => t.id !== id);
            pushToCloud();
            renderApp();
            showToast("Catatan transaksi dihapus", "info");
          });
        });
      });

      document.querySelectorAll('.btn-view-photo').forEach(btn => {
        btn.addEventListener('click', () => {
          const src = btn.getAttribute('data-photo');
          document.getElementById('photoViewerImg').src = src;
          document.getElementById('photoViewerModal').classList.remove('hidden');
        });
      });
    }

    // ==========================================
    // 12. MODAL SYSTEM IMPLEMENTATION
    // ==========================================
    const modalOverlay = document.getElementById('modalOverlay');
    const modalContent = document.getElementById('modalContent');

    function openModal(htmlContent) {
      modalContent.innerHTML = htmlContent;
      modalOverlay.classList.remove('hidden');
    }

    function closeModal() {
      modalOverlay.classList.add('hidden');
      modalContent.innerHTML = '';
    }

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    function promptConfirmModal(title, text, onConfirm) {
      openModal(`
        <div class="text-center space-y-3">

            <button id="btnModalConfirm" class="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-xl shadow-sm">Ya, Lanjutkan</button>
          </div>
        </div>
      `);
      document.getElementById('btnModalCancel').addEventListener('click', closeModal);
      document.getElementById('btnModalConfirm').addEventListener('click', () => {
        closeModal();
        onConfirm();
      });
    }

        if (title && target > 0) {
          appState.savings.push({
            id: 'sav_' + Date.now(),
            title: title,
            target: target,
            current: 0,
            history: []
          });
          pushToCloud();
          closeModal();
          renderApp();
          showToast("Celengan baru dibuat!", "success");
        }
      });
    }

    function promptSavingsAction(savingsId, action) {
      const item = appState.savings.find(s => s.id === savingsId);
      if (!item) return;

      openModal(`
        <div class="space-y-3">
          <div class="flex items-center justify-between border-b pb-2">
            <h3 class="font-bold text-stone-800 text-sm">${action === 'setor' ? '➕ Setor Tabungan' : '➖ Tarik Tabungan'}</h3>
            <button onclick="closeModal()" class="text-stone-400 font-bold">✕</button>
          </div>
          <p class="text-xs text-stone-500">Impian: <strong>${item.title}</strong></p>
          <form id="formSavingsAction" class="space-y-3">
            <div>
              <label class="text-[11px] font-bold text-stone-500 uppercase">Jumlah Nominal (Rp)</label>
              <input type="number" id="inputActionAmt" placeholder="0" inputmode="numeric" required class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-base font-bold text-amber-600">
            </div>
            <button type="submit" class="w-full py-3 bg-[#D98A2B] hover:bg-amber-600 text-white font-bold rounded-xl text-sm shadow-md transition">Proses ${action === 'setor' ? 'Setor' : 'Tarik'}</button>
          </form>
        </div>
      `);

      document.getElementById('formSavingsAction').addEventListener('submit', (e) => {
        e.preventDefault();
        const amt = parseInt(document.getElementById('inputActionAmt').value) || 0;
        if (amt > 0) {
          if (action === 'setor') {
            item.current += amt;
          } else {
            item.current = Math.max(0, item.current - amt);
          }
          item.history.push({ date: getLocalTodayStr(), amount: amt, type: action });
          pushToCloud();
          closeModal();
          renderApp();
          showToast(`Tabungan berhasil di-${action}!`, 'success');
        }
      });
    }

    function promptShoppingPriceModal(item) {
      openModal(`
        <div class="space-y-3">
          <h3 class="font-bold text-stone-800 text-sm">🛒 Item Belanjaan Dibeli!</h3>
          <p class="text-xs text-stone-500">Berapa harga yang Anda bayar untuk <strong>${item.text}</strong>?</p>
          <form id="formShoppingPrice" class="space-y-3">
            <div>
              <label class="text-[11px] font-bold text-stone-500 uppercase">Harga Total (Rp)</label>
              <input type="number" id="inputShopPrice" placeholder="0" inputmode="numeric" required class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-base font-bold text-[#E05A47]">
            </div>
            <div>
              <label class="text-[11px] font-bold text-stone-500 uppercase">Oleh Anggota</label>
              <select id="inputShopMember" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm">
                ${appState.members.map(m => `<option value="${m.id}">${m.emoji} ${m.name}</option>`).join('')}
              </select>
            </div>
            <div class="flex space-x-2 pt-2">
              <button type="button" id="btnSkipPrice" class="flex-1 py-2.5 bg-stone-100 text-stone-600 font-bold text-xs rounded-xl">Hanya Centang</button>
              <button type="submit" class="flex-1 py-2.5 bg-[#E05A47] text-white font-bold text-xs rounded-xl shadow-md">+ Catat Pengeluaran</button>
            </div>
          </form>
        </div>
      `);

      document.getElementById('btnSkipPrice').addEventListener('click', () => {
        pushToCloud();
        closeModal();
        renderApp();
      });

      document.getElementById('formShoppingPrice').addEventListener('submit', (e) => {
        e.preventDefault();
        const price = parseInt(document.getElementById('inputShopPrice').value) || 0;
        const mem = document.getElementById('inputShopMember').value;
        item.price = price;

        if (price > 0) {
          appState.transactions.unshift({
            id: 'trans_' + Date.now(),
            type: 'expense',
            amount: price,
            category: '🛒 Belanja Dapur',
            memberId: mem,
            date: getLocalTodayStr(),
            note: `Belanja: ${item.text}`,
            photo: null
          });
        }

        pushToCloud();
        closeModal();
        renderApp();
        showToast("Otomatis masuk ke Pengeluaran hari ini!", "success");
      });
    }

    function promptAddMemberModal() {
      openModal(`
        <div class="space-y-3">
          <div class="flex items-center justify-between border-b pb-2">
            <h3 class="font-bold text-stone-800 text-sm">👨‍👩‍👧‍👦 Tambah Anggota Keluarga</h3>
            <button onclick="closeModal()" class="text-stone-400 font-bold">✕</button>
          </div>
          <form id="formAddMemberModal" class="space-y-3">
            <div>
              <label class="text-[11px] font-bold text-stone-500 uppercase">Nama Anggota</label>
              <input type="text" id="inputMemName" placeholder="Contoh: Ibu, Ayah, Adik" required class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-sm">
            </div>
            <div>
              <label class="text-[11px] font-bold text-stone-500 uppercase">Pilih Ikon / Emoji</label>
              <select id="inputMemEmoji" class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-lg">
                <option value="👩">👩 Ibu</option>
                <option value="👨">👨 Ayah</option>
                <option value="👧">👧 Anak Perempuan</option>
                <option value="👦">👦 Anak Laki-Laki</option>
                <option value="👵">👵 Nenek</option>
                <option value="👴">👴 Kakek</option>
              </select>
            </div>
            <button type="submit" class="w-full py-3 bg-[#1E7B5E] hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow-md transition">Tambah Anggota</button>
          </form>
        </div>
      `);

      document.getElementById('formAddMemberModal').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('inputMemName').value.trim();
        const emoji = document.getElementById('inputMemEmoji').value;

        if (name) {
          appState.members.push({
            id: 'mem_' + Date.now(),
            name: name,
            emoji: emoji
          });
          pushToCloud();
          closeModal();
          renderApp();
          showToast("Anggota baru ditambahkan!", "success");
        }
      });
    }

    function promptChangePinModal() {
      openModal(`
        <div class="space-y-3">
          <h3 class="font-bold text-stone-800 text-sm">🔒 Ubah PIN Keamanan</h3>
          <form id="formChangePinModal" class="space-y-3">
            <div>
              <label class="text-[11px] font-bold text-stone-500 uppercase">PIN Baru (4 Digit angka)</label>
              <input type="password" maxlength="4" id="inputPinNew" pattern="[0-9]{4}" inputmode="numeric" required class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-2 text-base font-bold text-center tracking-widest">
            </div>
            <button type="submit" class="w-full py-2.5 bg-stone-800 hover:bg-stone-900 text-white font-bold rounded-xl text-xs transition">Simpan PIN Baru</button>
          </form>
        </div>
      `);

      document.getElementById('formChangePinModal').addEventListener('submit', (e) => {
        e.preventDefault();
        const pin = document.getElementById('inputPinNew').value;
        if (pin && pin.length === 4) {
          localStorage.setItem(PERMANENT_KEYS.PIN, pin);
          closeModal();
          renderApp();
          showToast("PIN Keamanan berhasil diubah!", "success");
        }
      });
    }

    // ==========================================
    // 13. DRAWER MENU & GLOBAL LISTENERS
    // ==========================================
    const drawerOverlay = document.getElementById('drawerOverlay');
    const drawerMenu = document.getElementById('drawerMenu');

    function openDrawer() {
      drawerOverlay.classList.remove('hidden');
      drawerMenu.classList.remove('translate-x-full');
    }

    function closeDrawer() {
      drawerMenu.classList.add('translate-x-full');
      setTimeout(() => drawerOverlay.classList.add('hidden'), 300);
    }

    document.getElementById('btnOpenMenu').addEventListener('click', openDrawer);
    document.getElementById('btnCloseDrawer').addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', closeDrawer);

    // Nav Item Click inside Drawer
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        const page = item.getAttribute('data-page');
        appState.activePage = page;
        closeDrawer();
        renderApp();
      });
    });

    // Calendar Toggle Header Click
    document.getElementById('btnToggleCalendar').addEventListener('click', (e) => {
      if (e.target.closest('#btnQuickToday')) return;
      const card = document.getElementById('calendarCard');
      const arrow = document.getElementById('calendarArrow');
      card.classList.toggle('hidden');
      arrow.classList.toggle('rotate-180');
    });

    document.getElementById('btnQuickToday').addEventListener('click', (e) => {
      e.stopPropagation();
      appState.filterMode = 'today';
      appState.selectedStartDate = currentAppTodayDate;
      appState.selectedEndDate = currentAppTodayDate;
      appState.calendarMonth = new Date().getMonth();
      appState.calendarYear = new Date().getFullYear();
      renderApp();
    });

    // Range Quick Select Buttons in Calendar Header
    document.querySelectorAll('.btn-range').forEach(btn => {
      btn.addEventListener('click', () => {
        const rangeType = btn.getAttribute('data-range');
        appState.filterMode = rangeType;

        const now = new Date();
        const todayStr = getLocalTodayStr();

        if (rangeType === 'today') {
          appState.selectedStartDate = todayStr;
          appState.selectedEndDate = todayStr;
        } else if (rangeType === '7d') {
          const past = new Date();
          past.setDate(now.getDate() - 6);
          const yyyy = past.getFullYear();
          const mm = String(past.getMonth() + 1).padStart(2, '0');
          const dd = String(past.getDate()).padStart(2, '0');
          appState.selectedStartDate = `${yyyy}-${mm}-${dd}`;
          appState.selectedEndDate = todayStr;
        } else if (rangeType === '1m') {
          const past = new Date();
          past.setMonth(now.getMonth() - 1);
          const yyyy = past.getFullYear();
          const mm = String(past.getMonth() + 1).padStart(2, '0');
          const dd = String(past.getDate()).padStart(2, '0');
          appState.selectedStartDate = `${yyyy}-${mm}-${dd}`;
          appState.selectedEndDate = todayStr;
        } else if (rangeType === '3m') {
          const past = new Date();
          past.setMonth(now.getMonth() - 3);
          const yyyy = past.getFullYear();
          const mm = String(past.getMonth() + 1).padStart(2, '0');
          const dd = String(past.getDate()).padStart(2, '0');
          appState.selectedStartDate = `${yyyy}-${mm}-${dd}`;
          appState.selectedEndDate = todayStr;
        } else if (rangeType === '6m') {
          const past = new Date();
          past.setMonth(now.getMonth() - 6);
          const yyyy = past.getFullYear();
          const mm = String(past.getMonth() + 1).padStart(2, '0');
          const dd = String(past.getDate()).padStart(2, '0');
          appState.selectedStartDate = `${yyyy}-${mm}-${dd}`;
          appState.selectedEndDate = todayStr;
        } else if (rangeType === '1y') {
          const past = new Date();
          past.setFullYear(now.getFullYear() - 1);
          const yyyy = past.getFullYear();
          const mm = String(past.getMonth() + 1).padStart(2, '0');
          const dd = String(past.getDate()).padStart(2, '0');
          appState.selectedStartDate = `${yyyy}-${mm}-${dd}`;
          appState.selectedEndDate = todayStr;
        }

        renderApp();
      });
    });

    document.getElementById('btnPrevMonth').addEventListener('click', () => {
      if (appState.calendarMonth === 0) {
        appState.calendarMonth = 11;
        appState.calendarYear -= 1;
      } else {
        appState.calendarMonth -= 1;
      }
      renderApp();
    });

    document.getElementById('btnNextMonth').addEventListener('click', () => {
      if (appState.calendarMonth === 11) {
        appState.calendarMonth = 0;
        appState.calendarYear += 1;
      } else {
        appState.calendarMonth += 1;
      }
      renderApp();
    });

    // Close Photo Viewer
    document.getElementById('btnClosePhotoViewer').addEventListener('click', () => {
      document.getElementById('photoViewerModal').classList.add('hidden');
    });

    // Backup JSON Export & Import
    document.getElementById('btnExportJSON').addEventListener('click', () => {
      const backupData = {
        walletId: walletId,
        exportDate: new Date().toISOString(),
        transactions: appState.transactions,
        members: appState.members,
        savings: appState.savings,
        shopping: appState.shopping
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `DompetKeluarga_Backup_${getLocalTodayStr()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast("File backup berhasil diunduh!", "success");
    });

    document.getElementById('btnImportJSON').addEventListener('click', () => {
      document.getElementById('fileImportInput').click();
    });

    document.getElementById('fileImportInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.transactions && imported.members) {
            appState.transactions = imported.transactions;
            appState.members = imported.members;
            if (imported.savings) appState.savings = imported.savings;
            if (imported.shopping) appState.shopping = imported.shopping;
            pushToCloud();
            closeDrawer();
            renderApp();
            showToast("Backup data berhasil dipulihkan!", "success");
          } else {
            showToast("Format file JSON tidak valid", "error");
          }
        } catch(err) {
          showToast("Gagal membaca file JSON", "error");
        }
      };
      reader.readAsText(file);
    });

    // Reset Wallet Button
    document.getElementById('btnResetWallet').addEventListener('click', () => {
      promptConfirmModal("RESET DATA DOMPET", "Tindakan ini akan menghapus SELURUH data pengeluaran, pemasukan, dan tabungan pada dompet ini secara permanen. Lanjutkan?", () => {
        appState.transactions = [];
        appState.savings = [];
        appState.shopping = [];
        appState.members = [{ id: 'saya', name: 'Saya', emoji: '👤' }];
        pushToCloud();
        closeDrawer();
        renderApp();
        showToast("Data dompet telah direset murni!", "info");
      });
    });

    // ==========================================
    // 14. APPLICATION INITIAL LAUNCH
    // ==========================================
    window.addEventListener('load', () => {
      initFirebaseCloudSync();
      renderApp();
    });
  </script>
</body>
</html>

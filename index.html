<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dompet Keluarga - Catatan Pengeluaran & Pemasukan</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            emerald: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            },
            coral: {
              500: '#f43f5e',
              600: '#e11d48',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Scrollbar styling for member pills */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Modal Backdrop Blur */
    .backdrop-blur-custom {
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="min-h-screen flex justify-center items-start sm:py-4 sm:px-2">

  <!-- Mobile Outer Shell Container (Max Width 480px) -->
  <div id="appShell" class="w-full max-w-[480px] bg-[#F8FAFC] min-h-screen sm:min-h-[92vh] sm:rounded-3xl shadow-xl flex flex-col relative overflow-hidden pb-12">
    
    <!-- TOP HEADER -->
    <header class="bg-[#047857] text-white pt-4 pb-3 px-4 shadow-md sticky top-0 z-20">
      <!-- Top Row: Logo/Title & Hamburger Menu -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-emerald-600 border border-emerald-400 flex items-center justify-center text-xl shadow-sm">
            🏡
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <h1 class="font-bold text-lg leading-tight tracking-tight">Dompet Keluarga</h1>
              <span id="syncDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" title="Tersambung ke Realtime DB"></span>
            </div>
            <p id="headerSubtitle" class="text-xs text-emerald-100 font-medium opacity-90">Catatan Pengeluaran</p>
          </div>
        </div>

        <!-- Hamburger Drawer Button -->
        <button id="btnOpenDrawer" class="w-10 h-10 rounded-xl bg-emerald-800/60 hover:bg-emerald-800 flex items-center justify-center border border-emerald-600 transition active:scale-95">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>

      <!-- Bottom Row: Member Filter Scrollable Pills -->
      <div class="mt-3.5 flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 text-sm font-medium" id="memberPillsContainer">
        <!-- Rendered dynamically -->
      </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main id="mainContainer" class="flex-1 px-4 pt-3 pb-6 space-y-4">
      <!-- Content rendered dynamically per page view -->
    </main>

  </div>

  <!-- SLIDE-OVER HAMBURGER DRAWER -->
  <div id="drawerOverlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden backdrop-blur-custom transition-opacity duration-300 opacity-0"></div>
  <aside id="drawerContent" class="fixed top-0 right-0 bottom-0 w-[80%] max-w-[320px] bg-white z-50 transform translate-x-full transition-transform duration-300 ease-out flex flex-col justify-between shadow-2xl">
    <div>
      <div class="p-5 bg-[#047857] text-white flex items-center justify-between">
        <div>
          <h2 class="font-bold text-lg">Menu Utama</h2>
          <p class="text-xs text-emerald-200" id="drawerDeviceId">ID: -</p>
        </div>
        <button id="btnCloseDrawer" class="w-8 h-8 rounded-lg bg-emerald-800/60 flex items-center justify-center text-white font-bold">✕</button>
      </div>

      <nav class="p-3 space-y-1" id="drawerNavItems">
        <button data-page="pengeluaran" class="nav-btn w-full text-left px-4 py-3 rounded-xl font-medium text-slate-700 hover:bg-emerald-50 hover:text-[#047857] flex items-center gap-3 transition">
          <span class="text-xl">💸</span> Catatan Pengeluaran
        </button>
        <button data-page="pemasukan" class="nav-btn w-full text-left px-4 py-3 rounded-xl font-medium text-slate-700 hover:bg-emerald-50 hover:text-[#047857] flex items-center gap-3 transition">
          <span class="text-xl">💰</span> Catatan Pemasukan
        </button>
        <button data-page="tabungan" class="nav-btn w-full text-left px-4 py-3 rounded-xl font-medium text-slate-700 hover:bg-emerald-50 hover:text-[#047857] flex items-center gap-3 transition">
          <span class="text-xl">🏦</span> Tabungan & Impian
        </button>
        <button data-page="ringkasan" class="nav-btn w-full text-left px-4 py-3 rounded-xl font-medium text-slate-700 hover:bg-emerald-50 hover:text-[#047857] flex items-center gap-3 transition">
          <span class="text-xl">📊</span> Ringkasan Keuangan
        </button>
        <button data-page="belanja" class="nav-btn w-full text-left px-4 py-3 rounded-xl font-medium text-slate-700 hover:bg-emerald-50 hover:text-[#047857] flex items-center gap-3 transition">
          <span class="text-xl">🛒</span> Daftar Belanja
        </button>
        <button data-page="anggota" class="nav-btn w-full text-left px-4 py-3 rounded-xl font-medium text-slate-700 hover:bg-emerald-50 hover:text-[#047857] flex items-center gap-3 transition">
          <span class="text-xl">👨‍👩‍👧‍👦</span> Anggota & Linked ID
        </button>
      </nav>
    </div>

    <!-- Drawer Footer -->
    <div class="p-4 border-t border-slate-100 bg-slate-50 space-y-3">
      <div class="flex items-center justify-between text-xs text-slate-500">
        <span>Status Cloud:</span>
        <span id="drawerSyncStatus" class="font-semibold text-emerald-600">● Realtime Sync</span>
      </div>
      <button id="btnResetLocal" class="w-full py-2.5 px-3 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold flex items-center justify-center gap-2 border border-rose-200 transition">
        🗑️ Reset Cache Data Lokal
      </button>
    </div>
  </aside>

  <!-- MODAL CONTAINER (Dynamic In-App Dialogs) -->
  <div id="modalContainer" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-custom hidden">
    <div id="modalCard" class="bg-white rounded-2xl w-full max-w-md p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto transform transition-all scale-95 opacity-0">
      <!-- Modal Content Rendered Dynamically -->
    </div>
  </div>

  <!-- RECEIPT PHOTO MODAL -->
  <div id="receiptModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-custom hidden">
    <div class="bg-white rounded-2xl w-full max-w-md p-4 space-y-3 relative">
      <button id="btnCloseReceipt" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 font-bold text-slate-600 flex items-center justify-center">✕</button>
      <h3 class="font-bold text-slate-800 text-center text-sm">Foto Bukti Transaksi</h3>
      <div class="max-h-[70vh] overflow-auto flex justify-center bg-slate-900 rounded-xl p-1">
        <img id="receiptImgFull" src="" alt="Bukti Transaksi" class="max-w-full h-auto object-contain rounded-lg">
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toastContainer" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none w-full max-w-xs px-4"></div>

  <!-- FIREBASE & APPLICATION ENGINE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyBDVnTPzgzHYct2P1BHEi5lRxR4RaKfvPc",
      authDomain: "dompet-keluarga-bac95.firebaseapp.com",
      databaseURL: "https://dompet-keluarga-bac95-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "dompet-keluarga-bac95",
      storageBucket: "dompet-keluarga-bac95.firebasestorage.app",
      messagingSenderId: "698410337790",
      appId: "1:698410337790:web:cbbc248f94c4e8e1d4acaf",
      measurementId: "G-KSEF93VVE0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- DEFENSIVE HELPER FUNCTIONS FOR MEMBER ICON & NAME (BUG FIX 1) ---
    window.getSafeIcon = function(obj) {
      if (!obj) return '👤';
      const raw = obj.emoji ?? obj.avatar ?? obj.icon ?? '';
      const str = String(raw).trim();
      if (!str || str === 'undefined' || str === 'null') return '👤';
      return str;
    };

    window.getSafeName = function(obj) {
      if (!obj) return 'Saya';
      const raw = obj.name ?? '';
      const str = String(raw).trim();
      if (!str || str === 'undefined' || str === 'null') return 'Saya';
      return str;
    };

    // Helper to get local date string YYYY-MM-DD (No UTC offset shift!)
    function getLocalTodayStr(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    // Standard Currency Formatter
    function formatRupiah(num) {
      const n = Math.abs(Number(num) || 0);
      return 'Rp ' + n.toLocaleString('id-ID');
    }

    // Short Compact Currency Formatter for Calendar Cells
    function formatShortRp(num) {
      const val = Math.abs(Number(num) || 0);
      if (val >= 1000000) {
        const jt = (val / 1000000).toFixed(1).replace('.0', '');
        return jt + 'jt';
      }
      if (val >= 1000) {
        const rb = Math.round(val / 1000);
        return rb + 'rb';
      }
      return val > 0 ? String(val) : '';
    }

    // Format Date for Header display
    function formatDisplayDate(dateStr) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const days = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      return `${days[dt.getDay()]}, ${dt.getDate()} ${months[dt.getMonth()]} ${dt.getFullYear()}`;
    }

    function formatShortDateNoYear(dateStr) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-').map(Number);
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      return `${d} ${months[m - 1]}`;
    }

    // --- DEVICE & WALLET IDENTIFIER MANAGEMENT ---
    function scanAndRestoreDeviceId() {
      // Search localStorage for existing DK- device ID
      const regex = /DK-[A-Z0-9]{4}-[A-Z0-9]{4}/;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const val = localStorage.getItem(key);
        if (regex.test(key)) return key.match(regex)[0];
        if (regex.test(val)) return val.match(regex)[0];
      }
      // Generate new if none exists
      const randomSeg = () => Math.random().toString(36).substring(2, 6).toUpperCase();
      const newId = `DK-${randomSeg()}-${randomSeg()}`;
      localStorage.setItem('dompet_device_id', newId);
      return newId;
    }

    const deviceId = scanAndRestoreDeviceId();
    let activeWalletId = localStorage.getItem('dompet_active_wallet') || deviceId;

    // --- APPLICATION STATE ---
    let state = {
      currentPage: 'pengeluaran', // pengeluaran, pemasukan, tabungan, ringkasan, belanja, anggota
      activeMemberId: 'ALL',     // 'ALL' or member ID string
      members: [
        { id: 'primary_member', name: 'Saya', emoji: '👤', isPrimary: true }
      ],
      transactions: [],
      savings: [],
      shopping: [],
      devicePin: localStorage.getItem('dompet_pin') || '1510',
      isLinked: activeWalletId !== deviceId,
      linkMode: localStorage.getItem('dompet_link_mode') || 'readwrite' // 'readwrite' or 'readonly'
    };

    // --- CALENDAR STATE (INDEPENDENT OF FIREBASE SYNC - BUG FIX 2) ---
    let calendarState = {
      isOpen: false,
      mode: 'today',       // 'today' | 'single' | 'range' | 'preset'
      presetKey: 'today',  // 'today' | '7d' | '1m' | '3m' | '6m' | '1y'
      startDate: getLocalTodayStr(),
      endDate: getLocalTodayStr(),
      awaitingRangeEnd: false,
      viewYear: new Date().getFullYear(),
      viewMonth: new Date().getMonth()
    };

    // Category presets with icons
    const EXPENSE_CATEGORIES = [
      { name: 'Makanan & Minuman', emoji: '🍔' },
      { name: 'Belanja Bulanan', emoji: '🛒' },
      { name: 'Transportasi & Bensin', emoji: '⛽' },
      { name: 'Tagihan & Listrik', emoji: '💡' },
      { name: 'Hiburan & Liburan', emoji: '🎬' },
      { name: 'Kesehatan & Obat', emoji: '💊' },
      { name: 'Pendidikan & Anak', emoji: '🎓' },
      { name: 'Pakaian & Gaya', emoji: '👕' },
      { name: 'Lain-lain', emoji: '📦' }
    ];

    const INCOME_CATEGORIES = [
      { name: 'Gaji Utama', emoji: '💼' },
      { name: 'Bonus & THR', emoji: '🎁' },
      { name: 'Usaha & Bisnis', emoji: '🏪' },
      { name: 'Investasi', emoji: '📈' },
      { name: 'Transfer & Saku', emoji: '💸' },
      { name: 'Lain-lain', emoji: '🪙' }
    ];

    // --- REALTIME DATABASE SYNC ---
    let unsubscribeDb = null;

    function attachFirebaseListeners(walletId) {
      if (unsubscribeDb) {
        // Detach existing listener if wallet changes
      }
      
      const dbRef = ref(db, `dompet/${walletId}`);
      document.getElementById('syncDot').className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse";
      document.getElementById('drawerSyncStatus').textContent = "● Menghubungkan...";

      onValue(dbRef, (snapshot) => {
        document.getElementById('syncDot').className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse";
        document.getElementById('drawerSyncStatus').textContent = "● Realtime Sync Active";

        const val = snapshot.val();
        if (val) {
          // Sanitize Members immediately (BUG FIX 1)
          if (val.members && Array.isArray(val.members)) {
            state.members = val.members.map(m => ({
              id: m.id || 'm_' + Math.random().toString(36).substr(2, 5),
              name: window.getSafeName(m),
              emoji: window.getSafeIcon(m),
              isPrimary: !!m.isPrimary
            }));
          } else {
            state.members = [{ id: 'primary_member', name: 'Saya', emoji: '👤', isPrimary: true }];
          }

          // Parse Transactions
          if (val.transactions) {
            state.transactions = Object.keys(val.transactions).map(k => ({
              id: k,
              ...val.transactions[k]
            }));
          } else {
            state.transactions = [];
          }

          // Parse Savings
          if (val.savings) {
            state.savings = Object.keys(val.savings).map(k => ({
              id: k,
              ...val.savings[k]
            }));
          } else {
            state.savings = [];
          }

          // Parse Shopping
          if (val.shopping) {
            state.shopping = Object.keys(val.shopping).map(k => ({
              id: k,
              ...val.shopping[k]
            }));
          } else {
            state.shopping = [];
          }
        } else {
          // New empty wallet online
          pushDefaultStateToFirebase(walletId);
        }

        renderApp();
      }, (error) => {
        console.error("Firebase Read Error:", error);
        document.getElementById('syncDot').className = "w-2.5 h-2.5 rounded-full bg-rose-500";
        document.getElementById('drawerSyncStatus').textContent = "⚠️ Offline / Cached";
        showToast("Menggunakan Mode Offline", "amber");
        renderApp();
      });
    }

    function pushDefaultStateToFirebase(walletId) {
      const defaultMembers = [{ id: 'primary_member', name: 'Saya', emoji: '👤', isPrimary: true }];
      set(ref(db, `dompet/${walletId}/members`), defaultMembers);
    }

    function syncStateToFirebase() {
      if (state.linkMode === 'readonly' && state.isLinked) {
        showToast("Dompet ini dalam mode Pantau (Baca Saja)", "amber");
        return;
      }
      set(ref(db, `dompet/${activeWalletId}/members`), state.members);
    }

    // Save single transaction
    window.saveTransactionToCloud = function(txData) {
      if (state.linkMode === 'readonly' && state.isLinked) {
        showToast("Mode Pantau: Tidak bisa menambah transaksi", "amber");
        return;
      }
      const newRef = push(ref(db, `dompet/${activeWalletId}/transactions`));
      set(newRef, txData);
      showToast("Transaksi Berhasil Dicatat! 🟢", "emerald");
    };

    window.deleteTransactionFromCloud = function(txId) {
      if (state.linkMode === 'readonly' && state.isLinked) {
        showToast("Mode Pantau: Tidak bisa menghapus transaksi", "amber");
        return;
      }
      remove(ref(db, `dompet/${activeWalletId}/transactions/${txId}`));
      showToast("Transaksi Dihapus", "slate");
    };

    // --- CALENDAR SELECTION LOGIC (BUG FIX 2) ---
    window.handleCalendarDayClick = function(dateStr) {
      if (!calendarState.awaitingRangeEnd) {
        // First click
        calendarState.mode = 'single';
        calendarState.presetKey = null;
        calendarState.startDate = dateStr;
        calendarState.endDate = dateStr;
        calendarState.awaitingRangeEnd = true;
        calendarState.isOpen = true;
      } else {
        // Second click
        if (dateStr === calendarState.startDate) {
          calendarState.mode = 'single';
          calendarState.awaitingRangeEnd = false;
        } else {
          // Sort lexicographically
          const [s, e] = dateStr < calendarState.startDate 
            ? [dateStr, calendarState.startDate] 
            : [calendarState.startDate, dateStr];
          calendarState.startDate = s;
          calendarState.endDate = e;
          calendarState.mode = 'range';
          calendarState.awaitingRangeEnd = false;
        }
        calendarState.isOpen = true;
      }
      renderApp();
    };

    window.applyCalendarPreset = function(presetKey) {
      const today = getLocalTodayStr();
      const todayDt = new Date();
      calendarState.presetKey = presetKey;
      calendarState.awaitingRangeEnd = false;
      calendarState.viewYear = todayDt.getFullYear();
      calendarState.viewMonth = todayDt.getMonth();

      if (presetKey === 'today') {
        calendarState.mode = 'today';
        calendarState.startDate = today;
        calendarState.endDate = today;
      } else if (presetKey === '7d') {
        calendarState.mode = 'preset';
        calendarState.endDate = today;
        const d = new Date();
        d.setDate(d.getDate() - 6);
        calendarState.startDate = getLocalTodayStr(d);
      } else if (presetKey === '1m') {
        calendarState.mode = 'preset';
        calendarState.endDate = today;
        const d = new Date();
        d.setDate(1); // 1st of current month
        calendarState.startDate = getLocalTodayStr(d);
      } else if (presetKey === '3m') {
        calendarState.mode = 'preset';
        calendarState.endDate = today;
        const d = new Date();
        d.setMonth(d.getMonth() - 2);
        d.setDate(1);
        calendarState.startDate = getLocalTodayStr(d);
      } else if (presetKey === '6m') {
        calendarState.mode = 'preset';
        calendarState.endDate = today;
        const d = new Date();
        d.setMonth(d.getMonth() - 5);
        d.setDate(1);
        calendarState.startDate = getLocalTodayStr(d);
      } else if (presetKey === '1y') {
        calendarState.mode = 'preset';
        calendarState.endDate = today;
        const d = new Date(todayDt.getFullYear(), 0, 1);
        calendarState.startDate = getLocalTodayStr(d);
      }
      renderApp();
    };

    window.navCalendarMonth = function(offset) {
      let m = calendarState.viewMonth + offset;
      let y = calendarState.viewYear;
      if (m < 0) {
        m = 11;
        y--;
      } else if (m > 11) {
        m = 0;
        y++;
      }
      calendarState.viewMonth = m;
      calendarState.viewYear = y;
      renderApp();
    };

    // Midnight Auto-Rollover Check
    setInterval(() => {
      const currentToday = getLocalTodayStr();
      if (calendarState.mode === 'today' && currentToday !== calendarState.startDate) {
        calendarState.startDate = currentToday;
        calendarState.endDate = currentToday;
        calendarState.viewYear = new Date().getFullYear();
        calendarState.viewMonth = new Date().getMonth();
        renderApp();
      }
    }, 15000);

    // --- MEMBER RESOLVER LOGIC ---
    function resolveMemberInfo(tx) {
      if (tx.memberId) {
        const found = state.members.find(m => m.id === tx.memberId);
        if (found) {
          return {
            icon: window.getSafeIcon(found),
            name: window.getSafeName(found)
          };
        }
      }
      return {
        icon: window.getSafeIcon({ emoji: tx.memberEmoji }),
        name: window.getSafeName({ name: tx.memberName })
      };
    }

    // --- FILTERED TRANSACTIONS CALCULATION ---
    function getFilteredTransactions(typeFilter = 'pengeluaran') {
      return state.transactions.filter(tx => {
        // Type match
        if (tx.type !== typeFilter) return false;
        
        // Member filter match
        if (state.activeMemberId !== 'ALL' && tx.memberId !== state.activeMemberId) return false;

        // Date range match
        const txDate = tx.date || '';
        if (txDate < calendarState.startDate || txDate > calendarState.endDate) return false;

        return true;
      });
    }

    // Calculate Days in current range inclusive
    function getSelectedRangeDaysCount() {
      const d1 = new Date(calendarState.startDate);
      const d2 = new Date(calendarState.endDate);
      const diffTime = Math.abs(d2 - d1);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
      return diffDays || 1;
    }

    // --- RENDERING ENGINE ---
    function renderApp() {
      renderHeaderMemberPills();
      renderPageContent();
      document.getElementById('drawerDeviceId').textContent = `ID: ${deviceId}`;
    }

    // Render Member Filter Scrollable Pills
    function renderHeaderMemberPills() {

        <button onclick="setActiveMemberFilter('ALL')"

              : 'bg-emerald-800/60 text-emerald-100 hover:bg-emerald-800'
          }">
          👥 Semua
        </button>
      `;

      state.members.forEach(m => {

        const name = window.getSafeName(m);

        html += `
          <button onclick="setActiveMemberFilter('${m.id}')" 
            class="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5 shadow-sm ${
              isActive
                ? 'bg-white text-[#047857]'
                : 'bg-emerald-800/60 text-emerald-100 hover:bg-emerald-800'
            }">
            <span>${icon}</span> <span>${name}</span>
          </button>
        `;
      });

      html += `
        <button onclick="openAddMemberModal()" 
          class="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition flex items-center gap-1 bg-emerald-800/40 text-white border border-emerald-400/50 hover:bg-emerald-700">
          + Tambah
        </button>

      container.innerHTML = html;

    window.setActiveMemberFilter = function(memId) {
      state.activeMemberId = memId;
      renderApp();
    };

    // Main Page Content Dispatcher
    function renderPageContent() {
      const main = document.getElementById('mainContainer');
      const subtitle = document.getElementById('headerSubtitle');

      if (state.currentPage === 'pengeluaran') {
        subtitle.textContent = "Catatan Pengeluaran";
        main.innerHTML = renderCalendarCard('pengeluaran') + renderPengeluaranPage();
      } else if (state.currentPage === 'pemasukan') {
        subtitle.textContent = "Catatan Pemasukan";
        main.innerHTML = renderCalendarCard('pemasukan') + renderPemasukanPage();
      } else if (state.currentPage === 'tabungan') {
        subtitle.textContent = "Tabungan & Impian";
        main.innerHTML = renderTabunganPage();
      } else if (state.currentPage === 'ringkasan') {
        subtitle.textContent = "Ringkasan Keuangan";
        main.innerHTML = renderCalendarCard('ringkasan') + renderRingkasanPage();
      } else if (state.currentPage === 'belanja') {
        subtitle.textContent = "Daftar Belanja";
        main.innerHTML = renderBelanjaPage();
      } else if (state.currentPage === 'anggota') {
        subtitle.textContent = "Anggota & Linked ID";
        main.innerHTML = renderAnggotaPage();
      }
    }

    // --- CALENDAR CARD COMPONENT ---
    function renderCalendarCard(pageType) {
      const todayStr = getLocalTodayStr();
      const isTodayMode = calendarState.startDate === todayStr && calendarState.endDate === todayStr;
      
      let dateDisplayText = '';
      if (calendarState.startDate === calendarState.endDate) {
        dateDisplayText = (calendarState.startDate === todayStr ? 'Hari Ini • ' : '') + formatDisplayDate(calendarState.startDate);
      } else {
        dateDisplayText = `${formatShortDateNoYear(calendarState.startDate)} – ${formatDisplayDate(calendarState.endDate)}`;
      }

      if (!calendarState.isOpen) {
        // Collapsed View
        return `
          <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-100 flex items-center justify-between cursor-pointer transition hover:border-emerald-200" onclick="toggleCalendarOpen()">
            <div class="flex items-center gap-2.5">
              <span class="text-xl">📅</span>
              <div>
                <div class="flex items-center gap-2">
                  ${isTodayMode ? '<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-extrabold tracking-wide">● HARI INI REALTIME</span>' : ''}
                  <span class="text-xs font-bold text-slate-700">${dateDisplayText}</span>
                </div>
              </div>
            </div>
            <span class="text-slate-400 font-bold text-sm">▼</span>
          </div>
        `;
      }

      // Expanded Calendar View
      const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      const viewTitle = `${monthNames[calendarState.viewMonth]} ${calendarState.viewYear}`;

      // Sum transactions per date cell for calendar overview
      const dailyTotals = {};
      state.transactions.forEach(tx => {
        if (pageType === 'ringkasan' || tx.type === pageType) {
          if (state.activeMemberId === 'ALL' || tx.memberId === state.activeMemberId) {
            dailyTotals[tx.date] = (dailyTotals[tx.date] || 0) + (Number(tx.amount) || 0);
          }
        }
      });

      // Calendar grid matrix generation
      const firstDayOfMonth = new Date(calendarState.viewYear, calendarState.viewMonth, 1).getDay();
      const daysInMonth = new Date(calendarState.viewYear, calendarState.viewMonth + 1, 0).getDate();
      
      let gridHtml = '';
      // Empty offset cells
      for (let i = 0; i < firstDayOfMonth; i++) {
        gridHtml += `<div class="h-11"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dStr = `${calendarState.viewYear}-${String(calendarState.viewMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        const isStart = dStr === calendarState.startDate;
        const isEnd = dStr === calendarState.endDate;
        const isSelectedBoundary = isStart || isEnd;
        const isInRange = dStr >= calendarState.startDate && dStr <= calendarState.endDate;
        const isTodayCell = dStr === todayStr;

        let cellStyle = "bg-slate-50 text-slate-700 hover:bg-emerald-50";
        if (isSelectedBoundary) {
          cellStyle = "bg-[#047857] text-white font-bold shadow-md scale-105 z-10 rounded-xl";
        } else if (isInRange) {
          cellStyle = "bg-[#D1FAE5] text-[#065F46] font-semibold rounded-lg";
        } else if (isTodayCell) {
          cellStyle = "border-2 border-emerald-500 font-bold bg-white text-emerald-800 rounded-xl";
        } else {
          cellStyle += " rounded-xl";
        }

        const totalForDay = dailyTotals[dStr];
        const shortBadge = totalForDay ? formatShortRp(totalForDay) : '';

        gridHtml += `
          <button onclick="handleCalendarDayClick('${dStr}')" 
            class="h-11 flex flex-col items-center justify-center relative transition text-xs ${cellStyle}">
            <span>${day}</span>
            ${shortBadge ? `<span class="text-[9px] leading-none mt-0.5 opacity-90 ${isSelectedBoundary ? 'text-white' : 'text-emerald-700 font-bold'}">${shortBadge}</span>` : ''}
          </button>
        `;
      }

      const presets = [
        { key: 'today', label: 'Hr Ini' },
        { key: '7d', label: '7H' },
        { key: '1m', label: '1B' },
        { key: '3m', label: '3B' },
        { key: '6m', label: '6B' },
        { key: '1y', label: '1T' }
      ];

      return `
        <div class="bg-white rounded-2xl p-4 shadow-md border border-slate-100 space-y-3">
          <!-- Calendar Header Bar -->
          <div class="flex items-center justify-between border-b pb-2">
            <div class="flex items-center gap-2">
              <span class="text-xl">📅</span>
              <span class="text-xs font-bold text-slate-800">${dateDisplayText}</span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="applyCalendarPreset('today')" class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white text-xs font-bold shadow-sm hover:bg-emerald-700">Hari Ini</button>
              <button onclick="toggleCalendarOpen()" class="text-slate-400 hover:text-slate-600 font-bold text-sm px-1">▲</button>
            </div>
          </div>

          <!-- Month Switcher & Controls -->
          <div class="flex items-center justify-between px-1">
            <button onclick="navCalendarMonth(-1)" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold flex items-center justify-center">&lt;</button>
            <span class="font-bold text-sm text-slate-800">${viewTitle}</span>
            <button onclick="navCalendarMonth(1)" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold flex items-center justify-center">&gt;</button>
          </div>

          <!-- Preset Quick Pills -->
          <div class="grid grid-cols-6 gap-1 bg-slate-100 p-1 rounded-xl">
            ${presets.map(p => `
              <button onclick="applyCalendarPreset('${p.key}')" 
                class="py-1 text-[11px] font-bold rounded-lg transition ${
                  calendarState.presetKey === p.key
                    ? 'bg-white text-[#047857] shadow-sm'
                    : 'text-slate-600 hover:bg-slate-200'
                }">
                ${p.label}
              </button>
            `).join('')}
          </div>

          <!-- Day Headers -->
          <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 py-1">
            <div>MIN</div><div>SEN</div><div>SEL</div><div>RAB</div><div>KAM</div><div>JUM</div><div>SAB</div>
          </div>

          <!-- Days Grid -->
          <div class="grid grid-cols-7 gap-1 text-center">
            ${gridHtml}
          </div>

          <!-- Dynamic Status Hint -->
          <div class="pt-1 text-center">
            ${calendarState.awaitingRangeEnd ? `
              <div class="px-3 py-1.5 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 text-[11px] font-medium inline-block">
                Tanggal awal: <b>${formatShortDateNoYear(calendarState.startDate)}</b> — ketuk tanggal ke-2 untuk rentang (atau ketuk lagi untuk 1 hari).
              </div>
            ` : `
              <p class="text-[11px] text-slate-400 italic">* Ketuk 1× untuk tanggal tunggal, ketuk tanggal ke-2 untuk pilih rentang tanggal.</p>
            `}
          </div>
        </div>
      `;
    }

    window.toggleCalendarOpen = function() {
      calendarState.isOpen = !calendarState.isOpen;
      renderApp();
    };

    // --- PENGELUARAN PAGE (EXPENSES) ---
    function renderPengeluaranPage() {
      const filtered = getFilteredTransactions('pengeluaran');
      const totalAmount = filtered.reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
      const daysCount = getSelectedRangeDaysCount();
      const avgPerDay = Math.round(totalAmount / daysCount);

      // Breakdown by category
      const catTotals = {};
      filtered.forEach(tx => {
        catTotals[tx.category] = (catTotals[tx.category] || 0) + (Number(tx.amount) || 0);
      });

      const catList = Object.keys(catTotals).map(cName => {
        const catObj = EXPENSE_CATEGORIES.find(c => c.name === cName) || { emoji: '📦' };
        const amt = catTotals[cName];
        const pct = totalAmount > 0 ? Math.round((amt / totalAmount) * 100) : 0;
        return { name: cName, emoji: catObj.emoji, amount: amt, pct };
      }).sort((a, b) => b.amount - a.amount);

      const isToday = calendarState.startDate === getLocalTodayStr() && calendarState.endDate === getLocalTodayStr();
      const heroTitle = isToday ? "PENGELUARAN HARI INI" : `TOTAL PENGELUARAN (${formatShortDateNoYear(calendarState.startDate)} - ${formatShortDateNoYear(calendarState.endDate)})`;

      return `

          <h2 class="text-3xl font-extrabold tracking-tight">${formatRupiah(totalAmount)}</h2>
          <div class="border-t border-white/20 pt-2.5 flex items-center justify-between text-xs text-rose-100 font-medium">

        <!-- Breakdown Kategori -->

              <div class="flex items-center justify-between text-xs font-semibold">
                <span class="flex items-center gap-1.5 text-slate-700">
                  <span>${c.emoji}</span> ${c.name}

                <span class="text-slate-800">${formatRupiah(c.amount)} (${c.pct}%)</span>

          <span class="text-xl">+</span> Catat Pengeluaran Baru

        <!-- Riwayat Pengeluaran -->

            <div class="bg-white rounded-2xl p-6 text-center text-slate-400 text-xs shadow-sm">

            </div>
          ` : filtered.map(tx => {

            <span>${state.savings.length} Target Impian</span>

        processAndSave();

    // Helper: Compress Photo via Canvas
    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 800;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
          callback(dataUrl);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      let bg = 'bg-slate-800 text-white';
      if (color === 'emerald') bg = 'bg-[#047857] text-white';
      if (color === 'rose') bg = 'bg-rose-600 text-white';
      if (color === 'amber') bg = 'bg-amber-600 text-white';

      toast.className = `${bg} px-4 py-2.5 rounded-xl shadow-lg text-xs font-bold transition transform translate-y-2 opacity-0 pointer-events-auto`;
      toast.textContent = msg;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0');

          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold">✕</button>
        </div>

        <form onsubmit="handleSaveShopping(event)" class="space-y-3 pt-1">
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">Nama Barang</label>
            <input type="text" id="shopName" placeholder="Contoh: Minyak Goreng 2L, Telur..." required class="w-full bg-slate-50 border px-3 py-2.5 rounded-xl text-xs font-semibold">
          </div>
          <button type="submit" class="w-full py-3 bg-[#047857] text-white font-bold rounded-xl text-xs">Tambah ke Daftar</button>
        </form>
      `;
      showModal(modalHtml);
    };

    window.handleSaveShopping = function(e) {
      e.preventDefault();
      const name = document.getElementById('shopName').value.trim();
      const newRef = push(ref(db, `dompet/${activeWalletId}/shopping`));
      set(newRef, { name, checked: false, createdAt: Date.now() });
      closeModal();
    };

    window.toggleShoppingItem = function(id, isChecked) {
      update(ref(db, `dompet/${activeWalletId}/shopping/${id}`), { checked: isChecked });
      if (isChecked) {
        const item = state.shopping.find(s => s.id === id);
        if (item) {
          // Open auto expense modal
          openQuickConvertExpenseModal(item.name);
        }
      }
    };

    window.openQuickConvertExpenseModal = function(itemName) {
      const modalHtml = `
        <div class="flex justify-between items-center border-b pb-3">
          <h3 class="font-bold text-base text-slate-800">Catat Belanjaan ke Pengeluaran</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold">✕</button>
        </div>

        <p class="text-xs text-slate-500">Barang <b>"${itemName}"</b> telah dicentang. Masukkan harga untuk mencatatnya langsung ke pengeluaran hari ini:</p>

        <form onsubmit="handleQuickConvertExpense(event, '${itemName}')" class="space-y-3 pt-1">
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">Total Harga (Rp)</label>
            <input type="text" id="quickPrice" inputmode="numeric" placeholder="0" oninput="formatCurrencyInput(this)" required class="w-full bg-slate-50 border px-3 py-2.5 rounded-xl text-base font-bold">
          </div>
          <button type="submit" class="w-full py-3 bg-rose-500 text-white font-bold rounded-xl text-xs">Catat Pengeluaran</button>
        </form>
      `;
      showModal(modalHtml);
    };

    window.handleQuickConvertExpense = function(e, itemName) {
      e.preventDefault();
      const amt = Number(document.getElementById('quickPrice').value.replace(/\./g, '')) || 0;
      if (amt <= 0) return;

      const memObj = state.members[0];
      const txData = {
        type: 'pengeluaran',
        amount: amt,
        category: 'Belanja Bulanan',
        title: itemName,
        memberId: memObj.id,
        memberEmoji: window.getSafeIcon(memObj),
        memberName: window.getSafeName(memObj),
        date: getLocalTodayStr(),
        createdAt: Date.now()
      };

      saveTransactionToCloud(txData);
      closeModal();
    };

    window.deleteShoppingItem = function(id) {
      remove(ref(db, `dompet/${activeWalletId}/shopping/${id}`));
    };

    // Linked ID Handlers
    window.handleConnectWallet = function(e) {
      e.preventDefault();
      const targetId = document.getElementById('targetWalletId').value.trim().toUpperCase();
      const mode = document.querySelector('input[name="connectMode"]:checked').value;

      if (!/^DK-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(targetId)) {
        showToast("Format ID tidak valid. Contoh: DK-XXXX-XXXX", "rose");
        return;
      }

      activeWalletId = targetId;
      localStorage.setItem('dompet_active_wallet', targetId);
      localStorage.setItem('dompet_link_mode', mode);
      state.isLinked = true;
      state.linkMode = mode;

      attachFirebaseListeners(activeWalletId);
      showToast(`Tersambung ke Dompet ${targetId}`, "emerald");
    };

    window.disconnectWallet = function() {
      activeWalletId = deviceId;
      localStorage.setItem('dompet_active_wallet', deviceId);
      localStorage.removeItem('dompet_link_mode');
      state.isLinked = false;
      state.linkMode = 'readwrite';

      attachFirebaseListeners(activeWalletId);
      showToast("Kembali ke Dompet Perangkat Ini", "emerald");
    };

    window.handleRestoreOldId = function() {
      const oldId = document.getElementById('restoreIdInput').value.trim().toUpperCase();
      if (!/^DK-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(oldId)) {
        showToast("Format ID tidak valid", "rose");
        return;
      }
      localStorage.setItem('dompet_device_id', oldId);
      location.reload();
    };

    window.openChangePinModal = function() {
      const modalHtml = `
        <div class="flex justify-between items-center border-b pb-3">
          <h3 class="font-bold text-base text-slate-800">Ubah PIN Keamanan</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold">✕</button>
        </div>

        <form onsubmit="handleChangePin(event)" class="space-y-3 pt-1">
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">PIN 4 Digit Baru</label>
            <input type="password" id="newPin" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" required class="w-full bg-slate-50 border px-3 py-2.5 rounded-xl text-center text-xl font-bold tracking-widest">
          </div>
          <button type="submit" class="w-full py-3 bg-[#047857] text-white font-bold rounded-xl text-xs">Simpan PIN Baru</button>
        </form>
      `;
      showModal(modalHtml);
    };

    window.handleChangePin = function(e) {
      e.preventDefault();
      const p = document.getElementById('newPin').value;
      if (p.length === 4) {
        state.devicePin = p;
        localStorage.setItem('dompet_pin', p);
        closeModal();
        renderApp();
        showToast("PIN Berhasil Diubah", "emerald");
      }
    };

    window.viewReceipt = function(base64Img) {
      document.getElementById('receiptImgFull').src = base64Img;
      document.getElementById('receiptModal').classList.remove('hidden');
    };

    document.getElementById('btnCloseReceipt').addEventListener('click', () => {
      document.getElementById('receiptModal').classList.add('hidden');
    });

    // Drawer Management
    const drawerOverlay = document.getElementById('drawerOverlay');
    const drawerContent = document.getElementById('drawerContent');

    function openDrawer() {
      drawerOverlay.classList.remove('hidden');
      setTimeout(() => {
        drawerOverlay.classList.remove('opacity-0');
        drawerContent.classList.remove('translate-x-full');
      }, 10);
    }

    function closeDrawer() {
      drawerOverlay.classList.add('opacity-0');
      drawerContent.classList.add('translate-x-full');
      setTimeout(() => {
        drawerOverlay.classList.add('hidden');
      }, 300);
    }

    document.getElementById('btnOpenDrawer').addEventListener('click', openDrawer);
    document.getElementById('btnCloseDrawer').addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', closeDrawer);

    // Nav Item Clicks inside Drawer
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const page = e.currentTarget.getAttribute('data-page');
        state.currentPage = page;
        closeDrawer();
        renderApp();
      });
    });

    // Reset Local Data Confirmation Dialog
    document.getElementById('btnResetLocal').addEventListener('click', () => {
      const modalHtml = `
        <div class="space-y-3 text-center">
          <div class="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-2xl mx-auto">🗑️</div>
          <h3 class="font-bold text-base text-slate-800">Reset Cache Data Lokal?</h3>
          <p class="text-xs text-slate-500">Tindakan ini akan membersihkan data penyimpanan lokal browser dan memuat ulang data dari server cloud.</p>
          <div class="flex gap-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl text-xs">Batal</button>
            <button onclick="confirmResetLocal()" class="flex-1 py-2.5 bg-rose-600 text-white font-bold rounded-xl text-xs">Ya, Reset Cache</button>
          </div>
        </div>
      `;
      showModal(modalHtml);
    });

    window.confirmResetLocal = function() {
      localStorage.clear();
      location.reload();
    };

    // --- INITIALIZATION ---
    window.onload = function() {
      attachFirebaseListeners(activeWalletId);
    };
  </script>
</body>
</html>
